<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Curso completo de Kubernetes para desenvolvedores .NET: do iniciante ao avançado, com labs práticos, AKS × GKE × EKS, segurança, GitOps e CKAD.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>K8s para Devs .NET — Curso Completo de Kubernetes (Iniciante → Avançado)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.0/800.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.1.0/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/jetbrains-mono@5.1.0/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
<style>
:root{
  --bg:#0b1220; --bg2:#0d1730; --panel:#101f3a; --panel2:#0f1b33; --line:#1e3a5f;
  --text:#e2e8f0; --muted:#94a3b8; --cyan:#22d3ee; --blue:#38bdf8; --violet:#a78bfa;
  --green:#34d399; --amber:#fbbf24; --red:#f87171;
  --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.7}
::selection{background:rgba(34,211,238,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#24466e;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#2f5a8c}

.topbar{position:fixed;inset:0 0 auto 0;height:62px;z-index:60;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:rgba(11,18,32,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.logo svg{width:34px;height:34px}
.logo b{font-weight:800;font-size:17px;letter-spacing:.2px}
.logo b span{color:var(--cyan)}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:1.4px;text-transform:uppercase;margin-top:-3px}
.top-search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;width:min(340px,32vw);color:var(--muted);cursor:pointer;transition:.2s}
.top-search:hover{border-color:var(--cyan)}
.top-search kbd{font-family:var(--mono);font-size:10.5px;background:#16294a;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
.progress-wrap{display:flex;align-items:center;gap:10px;min-width:150px}
.progress-bar{flex:1;height:7px;background:#152a4d;border-radius:99px;overflow:hidden;min-width:90px}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px;transition:width .5s ease}
.progress-txt{font-family:var(--mono);font-size:11.5px;color:var(--cyan);white-space:nowrap}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:9px;color:var(--text);width:38px;height:38px;cursor:pointer;font-size:17px}

.layout{display:flex;padding-top:62px;min-height:100vh}
#sidebar{width:330px;flex:0 0 330px;position:fixed;top:62px;bottom:0;left:0;overflow-y:auto;
  background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px 60px}
#main{flex:1;margin-left:330px;padding:34px clamp(18px,4vw,56px) 90px}
.content{max-width:940px;margin:0 auto;animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.side-home{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:linear-gradient(135deg,#123055,#0f2444);
  border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;margin-bottom:16px;font-size:14px}
.side-home:hover{border-color:var(--cyan)}
.mod{margin-bottom:8px}
.mod-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  color:var(--text);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s}
.mod-head:hover{border-color:#2f5a8c}
.mod-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--cyan);background:#0c2038;border:1px solid #1d4ed8aa;
  border-radius:7px;padding:3px 7px;white-space:nowrap}
.mod-title{flex:1;font-size:13.2px;font-weight:700;line-height:1.35}
.mod-count{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.mod-chev{transition:transform .25s;color:var(--muted);font-size:11px}
.mod.open .mod-chev{transform:rotate(90deg)}
.mod-body{display:none;padding:6px 4px 6px 12px;border-left:2px solid var(--line);margin:6px 0 4px 16px}
.mod.open .mod-body{display:block}
.les-link{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;color:var(--muted);cursor:pointer;
  font-size:13px;transition:.15s;text-decoration:none}
.les-link:hover{background:#132848;color:var(--text)}
.les-link.active{background:#0e3350;color:var(--cyan);font-weight:600}
.les-check{width:17px;height:17px;flex:0 0 17px;border-radius:50%;border:1.6px solid #33507a;display:grid;place-items:center;
  font-size:10px;color:transparent;transition:.2s}
.les-link.done .les-check{background:var(--green);border-color:var(--green);color:#06281c}
.les-link.done{color:#7d95b5}

.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:26px}
.hero img{width:100%;height:340px;object-fit:cover;display:block;filter:saturate(1.05)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.15) 20%,rgba(11,18,32,.94) 88%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:30px}
.hero-tag{font-family:var(--mono);font-size:11px;letter-spacing:2.5px;color:var(--cyan);font-weight:600;text-transform:uppercase}
.hero h1{font-size:clamp(26px,4vw,42px);font-weight:800;line-height:1.15;margin:8px 0 10px}
.hero h1 span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c3d2e8;max-width:660px;font-size:15px}
.hero-actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:11px 20px;font-weight:700;font-size:14px;
  cursor:pointer;border:1px solid transparent;transition:.2s;text-decoration:none;font-family:var(--sans)}
.btn-primary{background:linear-gradient(90deg,#0ea5e9,#22d3ee);color:#04121f}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,211,238,.3)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat b{font-size:24px;font-weight:800;color:var(--cyan);font-family:var(--mono)}
.stat span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sec-title{font-size:21px;font-weight:800;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title::before{content:'';width:5px;height:22px;border-radius:4px;background:linear-gradient(180deg,var(--cyan),var(--violet))}
.trail{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.trail-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.trail-card:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 10px 30px rgba(2,8,20,.5)}
.trail-card .lvl{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;border-radius:6px;padding:3px 8px;display:inline-block;margin-bottom:10px}
.lvl-ini{background:#052e22;color:var(--green);border:1px solid #14532d}
.lvl-int{background:#2e2405;color:var(--amber);border:1px solid #713f12}
.lvl-adv{background:#2a0a2e;color:#e879f9;border:1px solid #701a75}
.trail-card h3{font-size:15px;font-weight:700;margin-bottom:6px}
.trail-card p{font-size:12.8px;color:var(--muted);line-height:1.55}
.trail-card .tc-num{position:absolute;right:12px;top:8px;font-family:var(--mono);font-size:34px;font-weight:600;color:#173257}
.video-card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;transition:.2s;text-decoration:none;color:var(--text)}
.video-card:hover{border-color:var(--red)}
.video-ico{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:#3d0d13;border:1px solid #7f1d1d;display:grid;place-items:center;font-size:17px;color:#fca5a5}
.video-card b{font-size:14px;display:block;line-height:1.4}
.video-card small{color:var(--muted);font-size:12px}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.src-card{background:#0e1c36;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.src-card b{font-size:13.5px;color:var(--cyan);display:block;margin-bottom:4px}
.src-card small{color:var(--muted);font-size:12.5px;line-height:1.55;display:block}

.crumb{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.crumb span{color:var(--cyan)}
.lesson h1{font-size:clamp(23px,3vw,32px);font-weight:800;line-height:1.25;margin-bottom:6px}
.lesson .meta{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:22px;font-family:var(--mono)}
.lesson h2{font-size:19px;font-weight:800;margin:30px 0 10px;color:#f1f5f9}
.lesson h3{font-size:15.5px;font-weight:700;margin:22px 0 8px;color:#dbeafe}
.lesson p{margin:10px 0;color:#cbd5e1}
.lesson ul,.lesson ol{margin:10px 0 10px 22px;color:#cbd5e1}
.lesson li{margin:5px 0}
.lesson li::marker{color:var(--cyan)}
.lesson strong{color:#f8fafc}
.lesson em{color:var(--cyan);font-style:normal;font-weight:600}
.lesson a{color:var(--blue)}
.lesson img.fig{width:100%;border-radius:16px;border:1px solid var(--line);margin:16px 0 6px;display:block}
.figcap{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px;font-family:var(--mono)}
.callout{border-radius:13px;padding:14px 16px;margin:16px 0;font-size:14px;border:1px solid}
.callout.note{background:#0a2b22;border-color:#14532d;color:#bbf7d0}
.callout.note b{color:var(--green)}
.callout.cloud{background:#0c1f3d;border-color:#1d4ed8;color:#bfdbfe}
.callout.cloud b{color:var(--blue)}
.callout.warn{background:#331507;border-color:#92400e;color:#fde68a}
.callout.warn b{color:var(--amber)}
.callout.doc{background:#1e1336;border-color:#6d28d9;color:#ddd6fe}
.callout.doc b{color:var(--violet)}
.callout.lab{background:#05262f;border-color:var(--cyan);color:#cffafe}
.callout.lab b{color:var(--cyan)}
.callout.tip{background:#2e2405;border-color:var(--amber);color:#fde68a}
.callout.tip b{color:var(--amber)}
.callout.deep{background:#140d2e;border-color:#8b5cf6;color:#e9d5ff}
.callout.deep b{color:#c4b5fd}
.callout.lab ol,.callout.lab ul{margin:8px 0 4px 20px;color:#cffafe}
.callout.lab li{margin:5px 0}
.callout.lab code,.callout.tip code,.callout.deep code{background:rgba(255,255,255,.07);border-color:transparent}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:16px 0}
.terms div{background:#0e1c36;border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:11px;padding:10px 14px}
.terms dt{font-family:var(--mono);font-size:12.5px;color:var(--cyan);font-weight:600;margin-bottom:2px}
.terms dd{font-size:12.8px;color:#cbd5e1;margin:0}
.callout p{margin:4px 0;color:inherit}
table.tbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.3px;background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tbl th{background:#12294c;color:var(--cyan);text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);color:#cbd5e1;vertical-align:top}
.tbl tr:hover td{background:#0f2444}
.tbl code{font-family:var(--mono);font-size:12px;color:var(--amber)}

.codeblock{margin:16px 0;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:#0d1526}
.cb-head{display:flex;justify-content:space-between;align-items:center;background:#122036;padding:7px 14px;border-bottom:1px solid var(--line)}
.cb-head span{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);font-weight:600}
.copy-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:var(--mono);transition:.15s}
.copy-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.codeblock pre{margin:0!important;background:transparent!important;padding:14px 16px!important;font-size:12.8px!important;max-height:480px;overflow:auto}
.codeblock code{font-family:var(--mono)!important;font-size:12.8px!important;line-height:1.65!important;text-shadow:none!important}
p code,li code,td code{font-family:var(--mono);font-size:.88em;background:#132848;border:1px solid #1e3a5f;color:#7dd3fc;border-radius:6px;padding:1.5px 6px}

.quiz{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:13px;padding:16px 18px;margin:20px 0}
.quiz-q{font-weight:700;color:#f1f5f9;margin-bottom:12px;font-size:14.5px}
.quiz-tag{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:var(--violet);text-transform:uppercase;font-weight:600;display:block;margin-bottom:6px}
.quiz-opt{display:block;width:100%;text-align:left;background:#0e1e3a;border:1px solid var(--line);color:#cbd5e1;border-radius:10px;
  padding:10px 14px;margin:7px 0;cursor:pointer;font-size:13.5px;transition:.15s;font-family:var(--sans)}
.quiz-opt:hover:not(:disabled){border-color:var(--violet);transform:translateX(3px)}
.quiz-opt.correct{background:#052e22;border-color:var(--green);color:#a7f3d0}
.quiz-opt.wrong{background:#3d0d13;border-color:var(--red);color:#fecaca}
.quiz-opt:disabled{cursor:default;opacity:.92}
.quiz-fb{font-size:13px;margin-top:8px;display:none;font-weight:600}
.quiz.done .quiz-fb{display:block}
.quiz-fb.ok{color:var(--green)} .quiz-fb.no{color:var(--red)}

.ptabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.ptab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px 10px 0 0;padding:8px 18px;cursor:pointer;font-weight:700;font-size:13px;transition:.15s}
.ptab.active{background:#0e2a4d;color:var(--cyan);border-color:var(--cyan);border-bottom-color:#0e2a4d}
.ptab-panel{display:none;background:#0e1c36;border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:16px;margin-top:-1px}
.ptab-panel.active{display:block;animation:fadeUp .3s ease}
.ptab-panel h4{color:var(--cyan);font-size:14px;margin-bottom:6px}
.ptab-panel p{font-size:13.8px}

.les-nav{display:flex;justify-content:space-between;gap:14px;margin-top:44px;flex-wrap:wrap}
.nav-card{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 18px;cursor:pointer;transition:.2s;text-decoration:none;color:var(--text)}
.nav-card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.nav-card small{color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;display:block;margin-bottom:4px}
.nav-card b{font-size:13.5px}
.nav-card.next{text-align:right}
.done-btn{display:inline-flex;align-items:center;gap:9px;margin-top:26px;border-radius:11px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--green);background:#052e22;color:var(--green);transition:.2s}
.done-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(52,211,153,.25)}
.done-btn.is-done{background:var(--green);color:#052e22}

#searchModal{position:fixed;inset:0;background:rgba(4,9,18,.78);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:9vh 18px 18px}
#searchModal.open{display:flex}
.search-box{width:min(680px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fadeUp .25s ease}
.search-box input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;padding:18px 20px;font-family:var(--sans);border-bottom:1px solid var(--line)}
.search-results{max-height:55vh;overflow:auto;padding:8px}
.sr-item{display:block;padding:12px 16px;border-radius:11px;cursor:pointer;text-decoration:none;color:var(--text)}
.sr-item:hover{background:#12294c}
.sr-item b{font-size:14px;display:block}
.sr-item small{color:var(--muted);font-family:var(--mono);font-size:11px}
.sr-empty{padding:26px;text-align:center;color:var(--muted)}

@media(max-width:1020px){
  #sidebar{transform:translateX(-100%);transition:transform .3s ease;z-index:70;width:300px}
  #sidebar.open{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.5)}
  #main{margin-left:0}
  .burger{display:block}
  .top-search{width:auto;flex:1}
  .progress-wrap{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="burger" id="burger" aria-label="menu">☰</button>
  <div class="logo" id="logoHome">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="#22d3ee" stroke-width="2"/><circle cx="16" cy="16" r="4.5" fill="#38bdf8"/><g stroke="#38bdf8" stroke-width="2"><path d="M16 3v6M16 23v6M3 16h6M23 16h6M6.8 6.8l4.3 4.3M20.9 20.9l4.3 4.3M25.2 6.8l-4.3 4.3M11.1 20.9l-4.3 4.3"/></g></svg>
    <div><b>K8s<span>·Dev</span>Journey</b><small>Kubernetes para Devs .NET · v2 aprofundada</small></div>
  </div>
  <div class="top-search" id="openSearch">🔎 <span style="flex:1;font-size:13px">Buscar lição…</span><kbd>Ctrl K</kbd></div>
  <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><span class="progress-txt" id="progressTxt">0%</span></div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<div id="searchModal">
  <div class="search-box">
    <input id="searchInput" placeholder="Buscar conceito, objeto, comando… (ex: statefulset, gateway api, eviction)" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!-- Prism: bundle COM clike/markup/css/javascript; componentes na sequência correta -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-csharp.min.js"></script>
