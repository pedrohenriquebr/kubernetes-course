{id:'m4',num:'04',title:'Redes, Ingress & Gateway API',level:'int',lessons:[
{id:'m4l1',title:'DNS e descoberta de serviços',mins:7,body:
'<p>Cada cluster roda um DNS interno (CoreDNS). Todo Service ganha um nome: <code>&lt;service&gt;.&lt;namespace&gt;.svc.cluster.local</code>. Regras práticas:</p>'+
'<ul><li>Mesmo namespace → <code>http://pedidos-api</code></li>'+
'<li>Outro namespace → <code>http://pedidos-api.vendas</code> (ou FQDN completo)</li>'+
'<li>Portas nomeadas geram registros SRV (<code>_http._tcp.pedidos-api.vendas.svc…</code>)</li></ul>'+
C('bash',`# testando DNS de dentro do cluster:
kubectl run dns-test --rm -it --image=busybox:1.36 --restart=Never -- \\
  nslookup minha-api.meu-ns.svc.cluster.local`)+
NOTE('Em .NET, combine com <code>IHttpClientFactory</code> + Polly: a URL base vem da configuração (<code>http://pedidos-api</code>) e muda por ambiente via ConfigMap — dev local usa localhost, cluster usa DNS interno.')},
{id:'m4l2',title:'Services a fundo: EndpointSlices, headless e políticas de tráfego',mins:10,body:
'<p>Por dentro do Service: o <strong>kube-proxy</strong> mantém regras (iptables ou IPVS) em cada node para encaminhar conexões do IP virtual para os backends. Os backends são registrados em <strong>EndpointSlices</strong> (até ~100 endpoints por slice — escala muito melhor que o antigo objeto Endpoints) e podem carregar <em>topology hints</em> para preferir backends na mesma zona.</p>'+
'<h3>Service headless (clusterIP: None)</h3>'+
'<p>Sem IP virtual: o DNS retorna <strong>diretamente os IPs dos Pods</strong>. É o par obrigatório dos StatefulSets (<code>postgres-0.postgres-headless…</code>) e útil quando o cliente quer escolher o backend (ex.: gRPC com balanceamento client-side).</p>'+
C('yaml',`apiVersion: v1
kind: Service
metadata: { name: postgres-headless }
spec:
  clusterIP: None          # HEADLESS
  selector: { app: postgres }
  ports: [{ port: 5432 }]`)+
'<h3>Ajustes de comportamento</h3>'+
'<table class="tbl"><tr><th>Campo</th><th>Efeito</th><th>Quando usar</th></tr>'+
'<tr><td><code>sessionAffinity: ClientIP</code></td><td>mesmo cliente sempre no mesmo backend</td><td>apps com sessão em memória (evite; prefira estado fora do app)</td></tr>'+
'<tr><td><code>externalTrafficPolicy: Local</code></td><td>preserva IP de origem e evita salto extra</td><td>LoadBalancer/NodePort quando precisar do IP real do cliente</td></tr></table>'+
NOTE('C# e gRPC: conexões HTTP/2 de longa duração "grudam" em um backend. Com Services comuns, use load balancing client-side (ou recicle conexões) — é um caso típico onde entender EndpointSlices salva horas de debugging.')},
{id:'m4l3',title:'Ingress: HTTP/HTTPS na porta de entrada',mins:12,body:
'<p>Um Service <code>LoadBalancer</code> por app = um load balancer pago por app. O <strong>Ingress</strong> resolve isso: <em>um</em> entrypoint HTTP(S) que roteia por host e caminho para vários Services — com TLS, redirects e rewrites.</p>'+
FIG(IMG.ingress,'Ingress Controller roteando /api e /web para Services distintos')+
C('yaml',`apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loja-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # TLS automático
spec:
  ingressClassName: nginx
  rules:
  - host: api.loja.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: minha-api
            port:
              number: 80
  tls:
  - hosts: [api.loja.example.com]
    secretName: api-loja-tls`)+
'<p>O Ingress é só a <em>declaração</em>; quem executa é o <strong>Ingress Controller</strong> (NGINX, Traefik, ou os nativos de cada cloud). Anotações são específicas de cada controller — uma das limitações que motivou o Gateway API (próxima lição).</p>'+
CLOUD('<strong>AKS:</strong> add-on <em>Application Gateway Ingress Controller (AGIC)</em> ou NGINX. <strong>GKE:</strong> Ingress nativo (GLBC + Cloud Armor/WAF) ou NGINX. <strong>EKS:</strong> <em>AWS Load Balancer Controller</em> (ALB) ou NGINX.')},
{id:'m4l4',title:'Gateway API: o sucessor do Ingress',mins:10,body:
'<p>O <strong>Gateway API</strong> é o sucessor oficial do Ingress (GA em 2023): mais expressivo, portável entre implementações e desenhado em torno de <em>papéis</em>: provedor de infraestrutura, operador de cluster e desenvolvedor de aplicação.</p>'+
'<table class="tbl"><tr><th>Objeto</th><th>Dono</th><th>Papel</th></tr>'+
'<tr><td><code>GatewayClass</code></td><td>infra</td><td>define a implementação (ex.: ALB, GKE Gateway, Istio, Envoy)</td></tr>'+
'<tr><td><code>Gateway</code></td><td>operador</td><td>instância do gateway: listeners, portas, certificados</td></tr>'+
'<tr><td><code>HTTPRoute</code></td><td>dev</td><td>regras de roteamento: hosts, paths, filtros, traffic split</td></tr></table>'+
C('yaml',`apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: loja-gw }
spec:
  gatewayClassName: gke-l7-regional      # varia por implementação
  listeners:
  - name: https
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs: [{ name: api-loja-tls }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: loja-routes }
spec:
  parentRefs: [{ name: loja-gw }]
  hostnames: ["api.loja.example.com"]
  rules:
  - matches: [{ path: { type: PathPrefix, value: /v2 } }]
    backendRefs:
    - { name: minha-api-v2, port: 80, weight: 10 }   # canary nativo!
    - { name: minha-api-v1, port: 80, weight: 90 }
  - backendRefs: [{ name: minha-api, port: 80 }]`)+
'<p>Ganhos concretos sobre Ingress: traffic splitting com <code>weight</code> (canary), filtros padronizados (redirect, rewrite, header modification), autorização por rota (<code>ReferenceGrant</code>) e sem depender de anotações proprietárias.</p>'+
CLOUD('Suporte nativo crescente: <strong>GKE Gateway</strong> (Google), <strong>AKS</strong> com Application Gateway for Containers / AGIC Gateway API, <strong>EKS</strong> via AWS Load Balancer Controller e VPC Lattice; implementações portáveis: Istio, Cilium, NGINX Gateway Fabric, Envoy Gateway, Traefik.'),
},
{id:'m4l5',title:'NetworkPolicies: firewall entre Pods',mins:10,body:
'<p>Por padrão, <strong>todo Pod fala com todo Pod</strong>. NetworkPolicy é o firewall declarativo que muda isso — essencial para zero-trust dentro do cluster.</p>'+
C('yaml',`# 1) negar tudo por padrão no namespace pagamentos
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: pagamentos
spec:
  podSelector: {}        # todos os Pods
  policyTypes: [Ingress, Egress]
---
# 2) permitir apenas checkout -> api-pagamentos
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-checkout
  namespace: pagamentos
spec:
  podSelector:
    matchLabels: { app: api-pagamentos }
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: { app: checkout }
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: ingress }
    ports:
    - port: 8080`)+
'<p>As regras combinam <code>podSelector</code>, <code>namespaceSelector</code> e <code>ipBlock</code> (CIDR externo). Regras são aditivas: um Pod só é permitido por pelo menos uma política que o aceite.</p>'+
WARN('NetworkPolicy só funciona se o CNI suportar. Nos clouds: AKS (Azure CNI + políticas/Calico), GKE (Dataplane V2 aplica nativamente), EKS (Calico/Network Policy add-on). Sem isso, o YAML aplica… nada.'),
},
{id:'m4l6',title:'Service Mesh (visão geral)',mins:8,body:
'<p>Quando "rede" vira requisito de negócio — mTLS obrigatório, retries/circuit-breaker globais, canary por porcentagem, observabilidade de chamada a chamada — entra o <strong>service mesh</strong> (Istio, Linkerd): uma camada de proxies (<em>sidecars</em>) que intercepta o tráfego entre Pods.</p>'+
'<ul><li><strong>O que dá:</strong> mTLS automático, traffic splitting, timeouts/retries declarativos, telemetria rica.</li>'+
'<li><strong>O que cobra:</strong> complexidade operacional, latência extra, upgrades delicados.</li></ul>'+
NOTE('Antes de pensar em mesh: HTTP clients com resiliência no .NET (Polly) + Gateway API bem configurado. Mesh se paga em dezenas de serviços, não em três.')}
]},
/* ================= MÓDULO 5 ================= */
{id:'m5',num:'05',title:'Resiliência, Recursos & Scheduling',level:'int',lessons:[
{id:'m5l1',title:'Probes: liveness, readiness, startup',mins:10,body:
'<p>O Kubernetes pergunta ao seu app "você está bem?" de três formas. Sem probes, o cluster opera <em>cego</em>: não sabe reiniciar app travado nem tirar app não-pronto do tráfego.</p>'+
'<table class="tbl"><tr><th>Probe</th><th>Pergunta</th><th>Ação se falhar</th></tr>'+
'<tr><td><code>startupProbe</code></td><td>terminou de iniciar?</td><td>mata o Pod (protege boot lento; os outros probes pausam até ele passar)</td></tr>'+
'<tr><td><code>livenessProbe</code></td><td>travou/deadlock?</td><td><strong>reinicia</strong> o container</td></tr>'+
'<tr><td><code>readinessProbe</code></td><td>pronto p/ tráfego agora?</td><td>tira do Service (sem reiniciar)</td></tr></table>'+
'<p>Mecanismos disponíveis: <code>httpGet</code>, <code>tcpSocket</code>, <code>exec</code> e <code>grpc</code>. Parâmetros: <code>initialDelaySeconds</code>, <code>periodSeconds</code>, <code>timeoutSeconds</code>, <code>failureThreshold</code>, <code>successThreshold</code>.</p>'+
C('yaml',`    ports:
    - containerPort: 8080
    startupProbe:
      httpGet: { path: /healthz/startup, port: 8080 }
      failureThreshold: 30
      periodSeconds: 2
    livenessProbe:
      httpGet: { path: /healthz/live, port: 8080 }
      periodSeconds: 10
      timeoutSeconds: 3
    readinessProbe:
      httpGet: { path: /healthz/ready, port: 8080 }
      periodSeconds: 5`)+
NOTE('ASP.NET Core: <code>builder.Services.AddHealthChecks()</code> + <code>app.MapHealthChecks("/healthz/live")</code> etc., com <code>HealthCheckRegistration</code> e predicados para separar live/ready. Regra de ouro: liveness NÃO checa dependências externas (senão você reinicia em cascata quando o banco oscila); readiness CHECA.')},
{id:'m5l2',title:'Requests, limits e QoS',mins:10,body:
'<p>Todo container de produção deve declarar <strong>requests</strong> (reserva — usada pelo scheduler para escolher o node) e <strong>limits</strong> (teto — acima disso, CPU é estrangulada; memória é <em>OOMKilled</em>).</p>'+
C('yaml',`    resources:
      requests:            # "preciso de pelo menos"
        cpu: 250m          # 0.25 vCPU
        memory: 256Mi
      limits:              # "no máximo"
        cpu: "1"
        memory: 512Mi`)+
'<p>A relação requests/limits define a <strong>classe de QoS</strong>:</p>'+
'<table class="tbl"><tr><th>Classe</th><th>Condição</th><th>Sob pressão no node</th></tr>'+
'<tr><td>Guaranteed</td><td>requests == limits em TODOS os containers (cpu e memória)</td><td>último a ser sacrificado</td></tr>'+
'<tr><td>Burstable</td><td>algum request &lt; limit</td><td>sacrificável após BestEffort</td></tr>'+
'<tr><td>BestEffort</td><td>sem requests/limits</td><td>primeiro a morrer</td></tr></table>'+
WARN('No .NET, o GC respeita o limit de memória do container (cgroup). Limit apertado demais = OOMKill no pico de GC. Meça o working set com métricas (Módulo 7) e deixe folga (limit ≈ 1.5–2× o uso medido). Se o Pod aparece como <code>OOMKilled</code> em <code>kubectl describe</code>, essa é a causa.')},
{id:'m5l3',title:'Autoscaling: HPA, VPA, KEDA e Cluster Autoscaler',mins:12,body:
'<p><strong>HPA</strong> ajusta réplicas por métrica (requer <code>metrics-server</code> instalado); <strong>VPA</strong> ajusta requests/limits; <strong>Cluster Autoscaler/Karpenter</strong> ajusta o número de <em>nodes</em>.</p>'+
C('yaml',`apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: minha-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: minha-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: { type: Utilization, averageUtilization: 70 }
  behavior:                     # anti-flapping
    scaleDown:
      stabilizationWindowSeconds: 300   # espera 5 min antes de reduzir
      policies:
      - { type: Pods, value: 1, periodSeconds: 60 }`)+
'<p>Além de recursos, o HPA suporta métricas <em>custom</em> e <em>external</em> (via adapters) — ex.: profundidade de fila.</p>'+
'<p>E o queridinho de devs .NET: <strong>KEDA</strong> — escala por <em>eventos</em> (fila Service Bus, SQS, RabbitMQ, Kafka, Prometheus…) e até <strong>zero</strong>. Para Jobs de batch existe o <code>ScaledJob</code>:</p>'+
C('yaml',`apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: worker-sqs }
spec:
  scaleTargetRef: { name: meu-worker }
  minReplicaCount: 0
  maxReplicaCount: 20
  triggers:
  - type: aws-sqs-queue
    metadata:
      queueURL: https://sqs.us-east-1.amazonaws.com/123/pedidos
      queueLength: "5"`)+
CLOUD('KEDA é projeto CNCF criado pela Microsoft e vem como add-on nativo no AKS; no GKE/EKS você instala via Helm. Cluster Autoscaler existe nos três; na AWS o <em>Karpenter</em> (que provisiona nodes sob demanda em segundos) é muito comum no EKS.')},
{id:'m5l4',title:'Scheduling: affinity, taints e PDB',mins:11,body:
'<p>Quando "qualquer node serve" deixa de ser verdade:</p>'+
'<ul><li><strong>nodeSelector / nodeAffinity:</strong> "rode só em nodes com SSD" ou "prefira a zona X".</li>'+
'<li><strong>podAntiAffinity:</strong> "espalhe minhas réplicas em nodes/zonas diferentes" (alta disponibilidade).</li>'+
'<li><strong>taints + tolerations:</strong> nodes dedicados (GPU, batch) que repelem Pods não autorizados.</li>'+
'<li><strong>topologySpreadConstraints:</strong> distribuição uniforme entre zonas de disponibilidade.</li>'+
'<li><strong>PodDisruptionBudget (PDB):</strong> "durante manutenção voluntária (drain/upgrade), nunca deixe menos de N réplicas".</li></ul>'+
C('yaml',`apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: minha-api-pdb }
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: minha-api }`)+
C('yaml',`    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels: { app: minha-api }
            topologyKey: kubernetes.io/hostname`)+
QUIZ('Sua API deve sobreviver a picos e manutenções: qual combinação faz sentido?',
['limits altíssimos + BestEffort','probes + requests/limits + HPA + PDB','NodePort + replicas: 1','nenhum recurso, o cloud resolve'],1,
'Perfeito! Resiliência é camadas: detecção (probes), reserva (requests/limits), escala (HPA) e proteção contra manutenção (PDB).')+
QUIZ('Um Pod sem requests/limits recebe qual classe de QoS?',
['Guaranteed','Burstable','BestEffort','Premium'],2,
'Isso! Sem declarar nada = BestEffort = primeiro a ser sacrificado sob pressão.'),
},
{id:'m5l5',title:'Eviction, preemption e PriorityClass',mins:9,body:
'<p>Entender <em>como e por que</em> Pods morrem sem você pedir é conhecimento avançado obrigatório:</p>'+
'<ul><li><strong>Node-pressure eviction:</strong> quando um node fica sem memória/disco (sinais como <code>memory.available</code>), o <em>kubelet</em> evacua Pods — ordem: BestEffort → Burstable → Guaranteed (QoS de novo!). O Pod ganha status <code>Evicted</code>.</li>'+
'<li><strong>API-initiated eviction:</strong> o que <code>kubectl drain</code> usa; respeita PDBs e grace periods.</li>'+
'<li><strong>Preemption:</strong> um Pod de <strong>alta prioridade</strong> sem lugar pode <em>desalojar</em> Pods de menor prioridade para abrir espaço.</li></ul>'+
C('yaml',`apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata: { name: alta-criticidade }
value: 100000
globalDefault: false
description: "Workloads de pagamento — não devem ser preemptados"`)+
NOTE('Consequências para seu código .NET: trate todo shutdown como "pode acontecer agora". Workers de fila: ack só após processar e com handlers idempotentes; APIs: graceful shutdown no SIGTERM (já vem no Generic Host); Jobs: <code>restartPolicy: OnFailure</code> e retries idempotentes. Nada de assumir que o Pod vai viver.')+
QUIZ('O node está com memória quase esgotada. Qual Pod o kubelet evacua primeiro?',
['Guaranteed de produção','Burstable com requests baixos','BestEffort sem requests/limits','O mais novo'],2,
'Correto! BestEffort é a classe mais frágil e a primeira a ser evacuada sob pressão no node.')}
]},
/* ================= MÓDULO 6 ================= */
{id:'m6',num:'06',title:'Empacotamento, CI/CD & Ferramentas',level:'int',lessons:[
{id:'m6l1',title:'Helm: o gerenciador de pacotes',mins:10,body:
'<p>Aplicação real = dezenas de YAMLs interligados. O <strong>Helm</strong> empacota tudo em um <em>chart</em> com valores parametrizáveis — e instala/atualiza/desinstala com um comando, mantendo histórico de releases.</p>'+
C('bash',`helm repo add bitnami https://charts.bitnami.com/bitnami
helm install meu-postgres bitnami/postgresql --set auth.password=***

# seu chart:
helm install minha-api ./charts/minha-api -f values-dev.yaml
helm upgrade minha-api ./charts/minha-api -f values-prod.yaml
helm rollback minha-api 1
helm list`)+
'<p>Estrutura de um chart:</p>'+
C('bash',`charts/minha-api/
├── Chart.yaml          # nome, versão do chart
├── values.yaml         # valores padrão
├── values-prod.yaml    # overrides por ambiente
└── templates/          # YAMLs com template Go
    ├── deployment.yaml
    ├── service.yaml
    └── ingress.yaml`)+
C('yaml',`# templates/deployment.yaml (trecho)
spec:
  replicas: {{ .Values.replicas }}
  template:
    spec:
      containers:
      - name: api
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        resources: {{- toYaml .Values.resources | nindent 10 }}`)+
'<h3>Helm avançado</h3>'+
'<ul><li><strong>Hooks:</strong> Jobs executados em pontos do ciclo (<code>pre-install</code>, <code>pre-upgrade</code> — perfeito para migração de banco no deploy, <code>post-delete</code>…).</li>'+
'<li><strong>Dependências:</strong> um chart pode depender de outros (<code>dependencies</code> no Chart.yaml).</li>'+
'<li><strong>OCI registries:</strong> charts podem viver em ACR/GAR/ECR junto das imagens (<code>helm push/pull oci://…</code>).</li></ul>'},
{id:'m6l2',title:'Kustomize: overlays sem templates',mins:7,body:
'<p>Alternativa nativa (embutida no kubectl): mantenha YAMLs puros numa <em>base</em> e aplique <em>patches</em> por ambiente via <strong>overlays</strong>.</p>'+
C('bash',`k8s/
├── base/                 # deployment, service, kustomization.yaml
└── overlays/
    ├── dev/              # patches: replicas 1, recursos menores
    └── prod/             # patches: replicas 6, ingress TLS, HPA

kubectl apply -k k8s/overlays/prod`)+
C('yaml',`# overlays/prod/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
patches:
- path: replica-patch.yaml
labels:
- pairs:
    ambiente: prod`)+
'<p>Regra prática: <strong>Helm</strong> brilha para software de prateleira (Postgres, Redis, Prometheus) e charts compartilhados; <strong>Kustomize</strong> brilha para os manifests do <em>seu</em> app — inclusive é o formato preferido do GitOps com ArgoCD/Flux.</p>'},
{id:'m6l3',title:'CI/CD com GitHub Actions para .NET',mins:13,body:
'<p>O pipeline clássico do dev K8s: <strong>CI</strong> testa e publica a imagem; <strong>CD</strong> aplica manifests/Helm no cluster. Exemplo completo para .NET + Azure (ACR + AKS) — a mesma estrutura vale para GAR+GKE e ECR+EKS:</p>'+
C('yaml',`name: deploy-aks
on:
  push:
    branches: [main]
env:
  REGISTRY: meuregistry.azurecr.io
  IMAGE: minha-api
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with: { dotnet-version: 8.0.x }
    - run: dotnet test -c Release
    - run: dotnet publish -c Release -o out
    - uses: azure/docker-login@v2
      with:
        login-server: \${{ env.REGISTRY }}
        username: \${{ secrets.ACR_USER }}
        password: \${{ secrets.ACR_PASS }}
    - run: |
        docker build -t \${{ env.REGISTRY }}/\${{ env.IMAGE }}:\${{ github.sha }} .
        docker push \${{ env.REGISTRY }}/\${{ env.IMAGE }}:\${{ github.sha }}
  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/aks-set-context@v4
      with:
        cluster-name: prod-aks
        resource-group: rg-prod
    - run: |
        helm upgrade --install minha-api ./charts/minha-api \\
          --set image.tag=\${{ github.sha }} -n prod --create-namespace`)+
NOTE('Tag por <code>github.sha</code> (imutável) + <code>helm upgrade</code> = rollout rastreável e rollback trivial. Evite a tag <code>latest</code> em produção: ela quebra a semântica do rolling update (o cluster não sabe que a imagem mudou).')},
{id:'m6l4',title:'GitOps com ArgoCD',mins:9,body:
'<p><strong>GitOps</strong> inverte o CD: em vez do pipeline "empurrar" para o cluster, um operador <em>dentro</em> do cluster (ArgoCD/Flux) observa o Git e <strong>puxa</strong> o estado desejado, detectando e corrigindo <em>drift</em> (alguém mudou algo na mão? o ArgoCD reverte ou alerta).</p>'+
C('yaml',`apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: minha-api-prod, namespace: argocd }
spec:
  project: default
  source:
    repoURL: https://github.com/minha-org/k8s-manifests
    path: overlays/prod
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  syncPolicy:
    automated: { prune: true, selfHeal: true }`)+
'<p>Benefícios para times de dev: deploy = <strong>merge em PR</strong> (revisão + auditoria de graça), rollback = <strong>revert do commit</strong>, e o pipeline de CI para de guardar credenciais fortíssimas do cluster. Para vários ambientes, o padrão <em>app-of-apps</em> (um Application que aponta para outros) ou <code>ApplicationSet</code> escalam bem.</p>'},
{id:'m6l5',title:'Ferramentas auxiliares & experiência de desenvolvedor',mins:10,body:
'<p>Um cluster útil precisa de um kit instalado (via Helm, claro):</p>'+
C('bash',`# métricas (pré-requisito do HPA)
helm upgrade --install metrics-server metrics-server/metrics-server \\
  --repo https://kubernetes-sigs.github.io/metrics-server/

# ingress + TLS automático
helm upgrade --install ingress-nginx ingress-nginx \\
  --repo https://kubernetes.github.io/ingress-nginx
helm upgrade --install cert-manager cert-manager \\
  --repo https://charts.jetstack.io --set installCRDs=true

# observabilidade completa
helm upgrade --install kube-prom prometheus-community/kube-prometheus-stack \\
  --repo https://prometheus-community.github.io/helm-charts`)+
'<h3>Ferramentas de dev experience</h3>'+
'<table class="tbl"><tr><th>Ferramenta</th><th>O que faz</th></tr>'+
'<tr><td><code>k9s</code></td><td>TUI para navegar no cluster (logs, exec, describe sem sair do terminal)</td></tr>'+
'<tr><td>Lens / OpenLens</td><td>GUI visual do cluster</td></tr>'+
'<tr><td>Skaffold / Tilt</td><td>loop de dev: builda, aplica e reaplica automaticamente a cada mudança</td></tr>'+
'<tr><td>Telepresence</td><td>roda sua app <em>local</em> "plugada" no cluster (service discovery e DNS reais)</td></tr></table>'+
NOTE('Para .NET, o Telepresence é transformador: rode a API no Visual Studio/Rider <em>localmente</em> com breakpoint, enquanto ela conversa com os outros serviços e bancos que estão no cluster. Também vale <code>kubectl port-forward</code> para acesso rápido a DBs internos sem expô-los.')}
]},
/* ================= MÓDULO 7 ================= */
{id:'m7',num:'07',title:'Observabilidade & Debugging',level:'adv',lessons:[
{id:'m7l1',title:'Logs: do stdout ao cluster',mins:7,body:
'<p>Regra nº1: seu app escreve logs no <strong>stdout/stderr</strong> (o ASP.NET Core já faz isso com o console logger). O kubelet captura e o <code>kubectl logs</code> exibe. Em produção, um agente (Fluent Bit/Vector como DaemonSet) coleta e envia para um backend.</p>'+
C('bash',`kubectl logs deploy/minha-api -f --tail=200
kubectl logs NOME_POD --previous        # logs do container ANTES do crash (ouro p/ debug)
kubectl logs -l app=minha-api           # todos os Pods do selector`)+
CLOUD('<strong>AKS:</strong> Container Insights (Log Analytics). <strong>GKE:</strong> Cloud Logging nativo. <strong>EKS:</strong> CloudWatch via Fluent Bit. Nos três, logs estruturados (JSON) do .NET chegam pesquisáveis por campo.')+
NOTE('Use logs estruturados: <code>logger.LogInformation("Pedido {PedidoId} criado", id)</code> — os placeholders viram campos pesquisáveis no backend (não concatene strings).')},
{id:'m7l2',title:'Métricas: Prometheus + Grafana',mins:10,body:
'<p>O Prometheus "raspa" (scrape) endpoints HTTP de métricas e guarda séries temporais; o Grafana visualiza; o Alertmanager alerta. Métricas que todo dev deve conhecer: CPU, memória, latência HTTP, taxa de erro, saturação de fila.</p>'+
C('yaml',`# o Prometheus descobre seu Pod via annotations:
metadata:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9464"`)+
'<p>PromQL que salva vidas:</p>'+
C('bash',`# p95 de latência por serviço
histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le, job))

# taxa de erro 5xx
sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
  /
sum(rate(http_server_request_duration_seconds_count[5m]))`)+
NOTE('O .NET 8+ expõe métricas nativas no formato OpenTelemetry (<code>dotnet add package OpenTelemetry.Exporter.Prometheus.AspNetCore</code>): HTTP, GC, thread pool, exceptions — sem instrumentação manual.')},
{id:'m7l3',title:'Distributed tracing com OpenTelemetry',mins:9,body:
'<p>Em microsserviços, "a chamada está lenta" vira "QUAL chamada, em QUAL serviço?". O <strong>tracing</strong> conecta spans de uma requisição através de serviços via headers W3C (<code>traceparent</code>) — e o .NET é cidadão de primeira classe no OpenTelemetry:</p>'+
C('csharp',`// Program.cs
builder.Services.AddOpenTelemetry()
    .ConfigureResource(r => r.AddService("minha-api"))
    .WithTracing(t => t
        .AddAspNetCoreInstrumentation()
        .AddHttpClientInstrumentation()
        .AddOtlpExporter());          // env: OTEL_EXPORTER_OTLP_ENDPOINT

builder.Services.AddOpenTelemetry()
    .WithMetrics(m => m
        .AddAspNetCoreInstrumentation()
        .AddRuntimeInstrumentation()   // GC, heap, thread pool
        .AddOtlpExporter());`)+
C('yaml',`    env:
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://otel-collector.observability.svc:4317`)+
CLOUD('Backends: AKS → Application Insights (via OTel) ou Jaeger; GKE → Cloud Trace; EKS → AWS X-Ray. Todos aceitam OTLP, o protocolo aberto — troque o backend sem trocar o código.')},
{id:'m7l4',title:'Kit de debugging: do CrashLoop ao OOMKill',mins:11,body:
'<p>O fluxo de debug que resolve 95% dos problemas: <code>kubectl get pods</code> (status) → <code>kubectl describe pod</code> (events!) → <code>kubectl logs --previous</code> (crash) → <code>kubectl exec</code>/<code>debug</code> (dentro do container).</p>'+
'<table class="tbl"><tr><th>Sintoma</th><th>Causas prováveis</th><th>Investigação</th></tr>'+
'<tr><td><code>CrashLoopBackOff</code></td><td>erro no start, probe de liveness mal configurado, variável de ambiente faltando</td><td><code>logs --previous</code>, describe (events)</td></tr>'+
'<tr><td><code>ImagePullBackOff</code></td><td>tag errada, registry privado sem imagePullSecrets, nome errado</td><td>describe → eventos de pull</td></tr>'+
'<tr><td><code>Pending</code></td><td>sem recursos (requests altos), taints sem toleration, PVC não vinculado</td><td>describe pod (eventos do scheduler)</td></tr>'+
'<tr><td><code>OOMKilled</code></td><td>limit de memória baixo para o GC do .NET</td><td>describe (Last State), métricas de memória</td></tr>'+
'<tr><td><code>Evicted</code></td><td>node sem memória/disco (lição de eviction!)</td><td><code>kubectl describe node</code></td></tr></table>'+
C('bash',`kubectl get events -n prod --sort-by=.lastTimestamp | tail -20   # eventos recentes
kubectl top pods -n prod        # uso real de CPU/memória (requer metrics-server)
kubectl top nodes

# container de debug "acoplado" ao Pod (ephemeral container):
kubectl debug -it deploy/minha-api --image=mcr.microsoft.com/dotnet/sdk:8.0 \\
  --target=api -- dotnet-trace collect -p 1 --format speedscope

# ou um dump de memória p/ analisar no Visual Studio depois:
kubectl debug -it deploy/minha-api --image=mcr.microsoft.com/dotnet/sdk:8.0 \\
  --target=api -- dotnet-dump collect -p 1`)+
NOTE('<code>--target</code> compartilha o namespace de processos do container principal. Se sua imagem final não tem shell (distroless), o <code>kubectl debug</code> com imagem de SDK é a saída — ou mantenha <code>dotnet-monitor</code> habilitado em ambientes internos.'),
}
]},
/* ================= MÓDULO 8 ================= */
{id:'m8',num:'08',title:'Segurança & Políticas',level:'adv',lessons:[
{id:'m8l1',title:'RBAC: quem pode o quê',mins:10,body:
'<p>O RBAC do Kubernetes responde: <em>qual identidade</em> (User/Group/<strong>ServiceAccount</strong>) pode <em>qual verbo</em> (get/list/create/delete…) sobre <em>qual recurso</em> em <em>qual namespace</em>. Fluxo de uma requisição na API: <strong>autenticação → autorização (RBAC) → admission control → etcd</strong>.</p>'+
C('yaml',`apiVersion: v1
kind: ServiceAccount
metadata: { name: ci-deployer, namespace: prod }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: deployer, namespace: prod }
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "update", "patch"]
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ci-deployer-binding, namespace: prod }
subjects:
- kind: ServiceAccount
  name: ci-deployer
roleRef:
  kind: Role
  name: deployer
  apiGroup: rbac.authorization.k8s.io`)+
C('bash',`kubectl auth can-i update deployments -n prod \\
  --as=system:serviceaccount:prod:ci-deployer
# ClusterRoles prontos: cluster-admin, admin, edit, view`)+
WARN('Princípio do menor privilégio SEMPRE: seu Pod não precisa falar com a API do cluster? Não dê permissões ao ServiceAccount (ou use <code>automountServiceAccountToken: false</code>).')},
{id:'m8l2',title:'Secrets gerenciados pelos clouds',mins:11,body:
'<p>Secrets nativos em base64 não sobrevivem a uma auditoria séria. Padrão de produção: secrets vivem em um <strong>cofre gerenciado</strong> e são injetados no Pod via CSI driver, com <strong>identidade do workload</strong> (sem senhas em arquivo!). Para clusters fora dos clouds: <strong>External Secrets Operator</strong>, <strong>SOPS</strong> (criptografa o YAML no Git) ou <strong>Sealed Secrets</strong>.</p>'+
'<div class="ptabs">'+
'<button class="ptab active" data-t="aks" type="button">AKS (Azure)</button>'+
'<button class="ptab" data-t="gke" type="button">GKE (Google)</button>'+
'<button class="ptab" data-t="eks" type="button">EKS (AWS)</button>'+
'</div>'+
'<div class="ptab-panel active" data-t="aks"><h4>Azure Key Vault + Workload Identity</h4><p>O <em>Secrets Store CSI Driver</em> monta o Key Vault como volume; o Pod se autentica via <strong>Workload Identity Federation</strong> (token do service account vira identidade Entra ID). No .NET, <code>DefaultAzureCredential</code> com os SDKs de Key Vault funciona sem connection string.</p></div>'+
'<div class="ptab-panel" data-t="gke"><h4>Secret Manager + Workload Identity</h4><p>Workload Identity mapeia o ServiceAccount do K8s para uma <em>service account do IAM</em>; o app usa <code>Google.Cloud.SecretManager.V1</code> ou o CSI driver. Zero chaves JSON no repositório.</p></div>'+
'<div class="ptab-panel" data-t="eks"><h4>Secrets Manager + IRSA / Pod Identity</h4><p><em>IAM Roles for Service Accounts (IRSA)</em> — ou o mais simples <em>EKS Pod Identity</em> — associa permissões IAM ao Pod; o SDK da AWS (<code>AWSSDK.SecretsManager</code>) ou o CSI Provider AWS faz o resto.</p></div>'},
{id:'m8l3',title:'Hardening de Pods e supply chain',mins:9,body:
'<p>Checklist de hardening que todo manifest de produção deveria passar (os <em>Pod Security Standards</em> definem os níveis <code>privileged</code> → <code>baseline</code> → <code>restricted</code>):</p>'+
C('yaml',`    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      readOnlyRootFilesystem: true     # imagem imutável de verdade
      allowPrivilegeEscalation: false
      capabilities: { drop: ["ALL"] }
      seccompProfile: { type: RuntimeDefault }`)+
'<ul><li><strong>Scan de imagem</strong> no CI (Trivy/Grype) + registry que bloqueia vulnerabilidades críticas.</li>'+
'<li><strong>Assinatura de imagem</strong> (cosign/Sigstore) + admissão que só aceita imagens assinadas.</li>'+
'<li><strong>SBOM</strong> (inventário de dependências) gerado no build.</li>'+
'<li><strong>Políticas de admissão</strong> (Kyverno/OPA Gatekeeper): "proibido latest", "proibido root", "resources obrigatórios".</li>'+
'<li><strong>NetworkPolicies</strong> default-deny + RBAC mínimo.</li></ul>'+
NOTE('A imagem oficial <code>mcr.microsoft.com/dotnet/aspnet</code> já roda como usuário não-root — meio caminho andado para o nível <em>restricted</em>.')},
{id:'m8l4',title:'Admission control, webhooks e Pod Security Admission',mins:10,body:
'<p>Entre a autorização e a gravação no etcd existe o <strong>admission control</strong>: uma cadeia de plugins e webhooks que <em>modifica</em> (mutating) e <em>valida</em> (validating) cada requisição. É aqui que políticas viram lei — não recomendação.</p>'+
'<p>Fluxo completo: <strong>API → autenticação → RBAC → admission (mutating → validação de schema → validating) → etcd</strong>. Admissão nativa inclui ResourceQuota, LimitRanger, DefaultStorageClass, ServiceAccount e… o <strong>Pod Security Admission (PSA)</strong>, que substituiu o antigo PodSecurityPolicy.</p>'+
C('yaml',`# aplicar nível "restricted" a um namespace inteiro, com 3 rótulos:
apiVersion: v1
kind: Namespace
metadata:
  name: pagamentos
  labels:
    pod-security.kubernetes.io/enforce: restricted      # REJEITA Pods fora do padrão
    pod-security.kubernetes.io/audit: restricted         # registra violações
    pod-security.kubernetes.io/warn: restricted          # avisa no apply`)+
'<p>E com webhooks de política (Kyverno exemplo: bloquear imagens <code>:latest</code>):</p>'+
C('yaml',`apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: no-latest }
spec:
  validationFailureAction: Enforce
  rules:
  - name: require-tag
    match: { resources: { kinds: ["Pod"] } }
    validate:
      message: "Tag ':latest' é proibida em produção"
      pattern:
        spec:
          containers:
          - image: "!*:latest"`)+
QUIZ('Quais são os três modos de um label Pod Security Admission?',
['allow, deny, audit','enforce, audit, warn','strict, relaxed, open','on, off, log'],1,
'Isso! enforce (bloqueia), audit (registra) e warn (avisa) — permitindo migração gradual para o padrão restricted.')}
]},
/* ================= MÓDULO 9 ================= */
{id:'m9',num:'09',title:'Kubernetes Gerenciado: AKS × GKE × EKS',level:'adv',lessons:[
{id:'m9l1',title:'Panorama dos managed Kubernetes',mins:12,body:
'<p>Nos três clouds, o <strong>Control Plane é gerenciado</strong> (patch, HA, backups do etcd por conta do provider) e você opera os <em>node pools</em> (ou nem isso, nos modos serverless). O que diferencia é o ecossistema em volta — valores verificados nas páginas oficiais de preço (sujeitos a mudança):</p>'+
'<table class="tbl"><tr><th>Aspecto</th><th>AKS (Azure)</th><th>GKE (Google)</th><th>EKS (AWS)</th></tr>'+
'<tr><td>Control plane</td><td>Free tier grátis (sem SLA); Standard ~US$ 73/mês (~US$ 0,10/h) com SLA; Premium com LTS</td><td>US$ 0,10/h por cluster (Standard); no Autopilot a taxa é incluída no preço por Pod</td><td>US$ 0,10/h por cluster</td></tr>'+
'<tr><td>Modo serverless</td><td>Virtual nodes (ACI)</td><td><code>Autopilot</code> (cobra pelos requests dos Pods)</td><td><code>Fargate</code></td></tr>'+
'<tr><td>CNI padrão</td><td>Azure CNI / kubenet</td><td>VPC-native (Dataplane V2 aplica NetPol)</td><td>VPC CNI (IPs da VNet por Pod)</td></tr>'+
'<tr><td>Identidade p/ Pods</td><td>Workload Identity (Entra ID)</td><td>Workload Identity (IAM)</td><td>IRSA + EKS Pod Identity</td></tr>'+
'<tr><td>Ingress/Gateway</td><td>App Gateway (AGIC), Gateway API</td><td>GKE Ingress + Gateway nativo + Cloud Armor</td><td>ALB Ingress Controller, VPC Lattice</td></tr>'+
'<tr><td>Observabilidade</td><td>Container Insights</td><td>Cloud Monitoring/Logging nativo</td><td>CloudWatch Container Insights</td></tr>'+
'<tr><td>Autoscaler de nodes</td><td>Cluster Autoscaler (+KEDA add-on)</td><td>Cluster Autoscaler</td><td>Karpenter (muito comum)</td></tr>'+
'<tr><td>Windows nodes</td><td>⭐ excelente (herança .NET)</td><td>suportado</td><td>suportado</td></tr></table>'+
NOTE('Para times .NET: o AKS tem a melhor experiência com Windows containers e a integração mais curta com Entra ID/Azure DevOps. Mas os CONCEITOS que você aprendeu são 100% portáveis — mudar de cloud é trocar anotações e provisionamento, não o modelo mental.')+
QUIZ('O que é igual nos três providers?',
['O preço do control plane','Os objetos da API (Pod, Deployment, Service…) e o kubectl','O CNI padrão','O Ingress controller nativo'],1,
'Exato! Kubernetes é um padrão: a API e os objetos são os mesmos; o que muda são add-ons e integrações de cada nuvem.')},
{id:'m9l2',title:'AKS na prática (Azure)',mins:12,body:
C('bash',`az group create -n rg-prod -l brazilsouth
az acr create -n meuregistry -g rg-prod --sku Standard
az aks create -n prod-aks -g rg-prod \\
  --node-count 3 --node-vm-size Standard_D4s_v5 \\
  --enable-managed-identity --enable-workload-identity \\
  --attach-acr meuregistry --enable-addons monitoring \\
  --tier standard               # SLA de uptime (free tier = sem SLA)
az aks get-credentials -n prod-aks -g rg-prod`)+
'<h3>Workload Identity no seu código .NET</h3>'+
C('yaml',`apiVersion: v1
kind: ServiceAccount
metadata:
  name: minha-api
  annotations:
    azure/workload-client-id: 00000000-0000-0000-0000-000000000000`)+
C('csharp',`// Sem connection string, sem segredo no cluster:
builder.Configuration.AddAzureKeyVault(
    new Uri("https://meu-kv.vault.azure.net/"),
    new DefaultAzureCredential());   // resolve a Workload Identity do Pod`)+
'<p>Detalhes que importam no AKS: <strong>Azure CNI</strong> dá IP real da VNet aos Pods (integração com redes corporativas); <em>node pools</em> separados por SO (Linux/Windows) e criticidade (system vs user); <strong>virtual nodes</strong> permitem estourar carga para containers serverless (ACI); <strong>KEDA add-on</strong> oficial para autoscaling por eventos.</p>'+
NOTE('Sistemas legados .NET Framework? O AKS é a opção de primeira classe: node pools Windows Server com suporte a Windows containers, algo raro nos concorrentes.'),
},
{id:'m9l3',title:'GKE na prática (Google Cloud)',mins:10,body:
C('bash',`gcloud container clusters create-auto prod-gke \\
  --region southamerica-east1 \\
  --workload-pool meu-projeto.svc.id.goog

gcloud container clusters get-credentials prod-gke \\
  --region southamerica-east1`)+
'<p><strong>Autopilot</strong> é o modo "só me deixa desenvolver": o Google provisiona e dimensiona os nodes; você paga pelos <em>requests dos Pods</em> (vCPU, memória, storage), não por node — a taxa de gestão do cluster já está incluída. Perfeito para começar; para controle fino (GPU, kernel tuning, spot agressivo) use o modo <strong>Standard</strong> (US$ 0,10/h de gestão + custo dos nodes).</p>'+
C('yaml',`# Workload Identity: ServiceAccount do K8s -> IAM do Google
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minha-api
  annotations:
    iam.gke.io/gcp-service-account: minha-api@meu-projeto.iam.gserviceaccount.com`)+
'<p>No GKE, o <strong>Dataplane V2</strong> aplica NetworkPolicies nativamente (com observabilidade de rede no console), o <strong>GKE Gateway</strong> implementa a Gateway API com balanceadores globais do Google, e o <strong>Config Sync/Fleet</strong> leva GitOps a múltiplos clusters.</p>'},
{id:'m9l4',title:'EKS na prática (AWS)',mins:10,body:
'<p>Na AWS, a forma menos dolorosa é o <code>eksctl</code>:</p>'+
C('bash',`eksctl create cluster --name prod-eks \\
  --region us-east-1 --nodegroup-name ng-app \\
  --node-type m6i.xlarge --nodes 3 --asg-access

# IRSA: role IAM amarrada ao ServiceAccount
eksctl create iamserviceaccount --name minha-api \\
  --namespace prod --cluster prod-eks \\
  --role-name minha-api-sqs \\
  --attach-policy-arn arn:aws:iam::aws:policy/AmazonSQSFullAccess`)+
'<p><strong>IRSA vs EKS Pod Identity</strong> (o mecanismo mais novo): IRSA exige configurar o provedor OIDC e trust policies por cluster; Pod Identity desacopla roles de service accounts — você cria uma associação simples e ela vale para o cluster todo, sem trust policies — mais simples de escalar para muitos clusters. Os dois coexistem.</p>'+
C('yaml',`apiVersion: v1
kind: ServiceAccount
metadata:
  name: minha-api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789:role/minha-api-sqs`)+
'<p>Ecossistema típico do EKS: <strong>Karpenter</strong> (nodes sob medida em segundos, spot inteligente), <strong>AWS Load Balancer Controller</strong> (ALB para Ingress/Gateway API), <strong>EFS CSI</strong> para RWX. O .NET consome SQS/S3/Dynamo herdando as credenciais do Pod automaticamente.</p>'},
{id:'m9l5',title:'Custos e otimização',mins:8,body:
'<ul><li><strong>Right-size:</strong> VPA em modo <em>recommendation</em> + métricas reais; requests inflados = dinheiro queimado (e no Autopilot isso é literal: você paga pelo request).</li>'+
'<li><strong>Spot/preemptible:</strong> node pools spot para workloads tolerantes a interrupção (workers, batch) com tolerations — até ~70–90% mais barato.</li>'+
'<li><strong>Cluster Autoscaler/Karpenter:</strong> desliga capacity ocioso automaticamente.</li>'+
'<li><strong>Quotas por namespace + showback:</strong> labels de equipe + ferramentas como <strong>OpenCost/Kubecost</strong> para ratear a conta.</li>'+
'<li><strong>Autoscaling de Pods:</strong> HPA/KEDA reduz réplicas fora do pico (e KEDA zera workers ociosos).</li></ul>'+
WARN('A pegadinha clássica de custo: requests muito maiores que o uso real + HPA sem Cluster Autoscaler = Pods "Pending" em cluster cheio. Autoscaling de Pods e de nodes precisam evoluir juntos.')}
]},
/* ================= MÓDULO 10 ================= */
{id:'m10',num:'10',title:'Avançado: Operators, Upgrades & Projeto Final',level:'adv',lessons:[
{id:'m10l1',title:'CRDs e Operators: estendendo o Kubernetes',mins:11,body:
'<p>Lembra do modelo declarativo? <strong>CRDs (Custom Resource Definitions)</strong> deixam você inventar <em>novos objetos</em>, e um <strong>controller/Operator</strong> implementa o reconciliation loop deles. É assim que o ecossistema modela "coisas" fora do core:</p>'+
C('yaml',`apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: backups.exemplo.com.br }
spec:
  group: exemplo.com.br
  scope: Namespaced
  names: { kind: Backup, plural: backups, singular: backup }
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              schedule: { type: string }`)+
'<p>Exemplos famosos que você já usou neste curso sem saber: <em>cert-manager</em> (Certificate), <em>Prometheus Operator</em> (ServiceMonitor), <em>ArgoCD</em> (Application), <em>KEDA</em> (ScaledObject), <em>Kyverno</em> (Policy), <em>Strimzi</em> (Kafka).</p>'+
'<p>Você raramente precisará <strong>escrever</strong> um Operator como dev de aplicação — mas saber <strong>ler</strong> CRDs destrava qualquer plataforma. E quando precisar, o caminho é <strong>Kubebuilder/controller-runtime</strong> (Go) ou o <em>KubeOps</em> (C#!), que geram o esqueleto do controller:</p>'+
C('bash',`# esqueleto de um operator em Go com Kubebuilder
kubebuilder init --domain exemplo.com.br --repo github.com/meu/backup-operator
kubebuilder create api --group exemplo --version v1 --kind Backup`)+
NOTE('Sim, existe ecossistema .NET para Operators (KubeOps, dotnet-operator-sdk). Para a maioria dos casos, porém, você vai CONSUMIR operators — e para isso basta saber <code>kubectl explain</code> + ler o CRD.'),
},
{id:'m10l2',title:'Upgrades, manutenção e drains',mins:10,body:
'<p>Clusters precisam de patch constante (segurança!). Nos gerenciados, o fluxo padrão é: <strong>upgrade do Control Plane primeiro</strong> (via provider), depois <strong>node pools</strong> — normalmente com <em>surge nodes</em>: nodes novos entram, Pods migram, nodes antigos saem. Mantenha a política de <em>version skew</em>: kubelets podem ficar no máximo algumas versões menores atrás do API server; não deixe o cluster "derivar".</p>'+
C('bash',`# operações de manutenção manual (mesma mecânica dos clouds):
kubectl cordon node-3          # marca como não-agendável
kubectl drain node-3 \\
  --ignore-daemonsets \\
  --delete-emptydir-data       # evacua Pods respeitando PDBs!
kubectl uncordon node-3        # volta a aceitar Pods`)+
'<p>O que garante zero downtime durante tudo isso (Módulo 5 de novo): Deployments com múltiplas réplicas espalhadas (anti-affinity/topology spread) + <strong>PDB</strong> + <strong>terminationGracePeriodSeconds</strong> adequado + <strong>preStop</strong> + probes corretos.</p>'+
NOTE('Sua parte como dev no upgrade: o app precisa aceitar SIGTERM e drenar conexões (o ASP.NET Core já faz), processar Jobs idempotentemente e não depender de IP/hostname do Pod. Se o app não é "drenável", a manutenção do cluster vira janela de indisponibilidade.')+
QUIZ('Durante um node drain, o que impede que TODAS as réplicas da sua API sejam evacuadas ao mesmo tempo?',
['O kube-proxy','O PodDisruptionBudget','O ConfigMap','O HPA'],1,
'Correto! O PDB é respeitado pelo drain (eviction via API) e garante o mínimo de disponibilidade durante manutenções voluntárias.'),
},
{id:'m10l3',title:'Multi-cluster e padrões avançados',mins:8,body:
'<ul><li><strong>Por que multi-cluster?</strong> DR/região extra, isolamento de tenants, blast radius, follow-the-sun.</li>'+
'<li><strong>Gerência de frota:</strong> Google Fleet/Anthos, Azure Arc/AKS Fleet, AWS EKS Anywhere.</li>'+
'<li><strong>Deploy em frota:</strong> GitOps com ArgoCD "app-of-apps"/ApplicationSet ou Flux — o Git continua sendo a fonte da verdade de todos os clusters.</li>'+
'<li><strong>Tráfego global:</strong> DNS geo + Global Load Balancers (Azure Front Door, Cloud LB global, Route53) apontando para o gateway de cada cluster.</li></ul>'+
WARN('Multi-cluster multiplica custo e complexidade (identidade, rede, secrets, observabilidade por cluster). Comece com UM cluster bem operado; multi-cluster é resposta a requisito explícito de negócio/DR.')},
{id:'m10l4',title:'Projeto final: microsserviços .NET de ponta a ponta',mins:15,body:
'<p>Hora de juntar tudo. Arquitetura alvo: <strong>API de pedidos</strong> (.NET) + <strong>worker</strong> de fila + <strong>Postgres</strong>, com Ingress TLS, probes, HPA, PDB, secrets do cloud e CI/CD GitOps.</p>'+
C('yaml',`# 1) namespace (com PSA) + config
apiVersion: v1
kind: Namespace
metadata:
  name: loja
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ConfigMap
metadata: { name: pedidos-config, namespace: loja }
data:
  ASPNETCORE_ENVIRONMENT: Production
  QueueSettings__NomeFila: "pedidos-novos"
---
# 2) Deployment da API com tudo que o curso ensinou
apiVersion: apps/v1
kind: Deployment
metadata: { name: pedidos-api, namespace: loja }
spec:
  replicas: 2
  selector: { matchLabels: { app: pedidos-api } }
  template:
    metadata:
      labels: { app: pedidos-api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "9464" }
    spec:
      serviceAccountName: pedidos-api
      terminationGracePeriodSeconds: 45
      containers:
      - name: api
        image: meuregistry/pedidos-api:1.4.0
        ports: [{ containerPort: 8080 }]
        envFrom: [{ configMapRef: { name: pedidos-config } }]
        resources:
          requests: { cpu: 250m, memory: 256Mi }
          limits:   { cpu: "1",  memory: 512Mi }
        startupProbe:  { httpGet: { path: /healthz/startup, port: 8080 }, failureThreshold: 30, periodSeconds: 2 }
        livenessProbe: { httpGet: { path: /healthz/live,  port: 8080 }, periodSeconds: 10 }
        readinessProbe:{ httpGet: { path: /healthz/ready, port: 8080 }, periodSeconds: 5 }
        lifecycle:
          preStop: { exec: { command: ["sh","-c","sleep 5"] } }
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }
---
# 3) Service + Ingress + HPA + PDB
apiVersion: v1
kind: Service
metadata: { name: pedidos-api, namespace: loja }
spec:
  selector: { app: pedidos-api }
  ports: [{ port: 80, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: loja, namespace: loja }
spec:
  ingressClassName: nginx
  rules:
  - host: api.loja.example.com
    http:
      paths:
      - { path: /, pathType: Prefix, backend: { service: { name: pedidos-api, port: { number: 80 } } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: pedidos-api, namespace: loja }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: pedidos-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
  - type: Resource
    resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: pedidos-api, namespace: loja }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: pedidos-api } }`)+
'<h3>Checklist de entrega (valide-se!)</h3>'+
'<ol><li>✅ Imagem multi-stage, não-root, sem <code>latest</code> (Módulos 1 e 8).</li>'+
'<li>✅ Config via ConfigMap; segredos via cofre do cloud com workload identity (Módulos 3 e 8).</li>'+
'<li>✅ Probes + resources + HPA + PDB + preStop/grace period (Módulos 2 e 5).</li>'+
'<li>✅ Ingress com TLS; Service ClusterIP interno (Módulo 4).</li>'+
'<li>✅ Logs estruturados + métricas OTel + tracing (Módulo 7).</li>'+
'<li>✅ CI publica imagem por SHA; CD via GitOps (Módulo 6).</li>'+
'<li>✅ NetworkPolicy default-deny + PSA no namespace (Módulos 4 e 8).</li>'+
'<li>✅ Worker em KEDA com scale-to-zero quando a fila esvazia (Módulo 5).</li></ol>'+
NOTE('Parabéns por chegar até aqui! 🎉 Você agora domina o modelo mental agnóstico do Kubernetes (cobrindo TODAS as áreas da documentação de conceitos oficial) e sabe traduzi-lo para AKS, GKE ou EKS. Próximo passo sugerido: certificação <strong>CKAD</strong> — especialmente alinhada ao perfil de dev que este curso construiu.')
}]}
];

/* ============================================================ APP */
const LS_KEY='k8sjourney_progress_v2';
let done = new Set(JSON.parse(localStorage.getItem(LS_KEY)||'[]'));
const FLAT = COURSE.flatMap(m=>m.lessons.map(l=>Object.assign({},l,{mod:m})));
const totalLessons = FLAT.length;
const $ = s=>document.querySelector(s);

function saveProgress(){ localStorage.setItem(LS_KEY, JSON.stringify(Array.from(done))); }

function renderSidebar(){
  const sb=$('#sidebar');
  sb.innerHTML = '<button class="side-home" id="sideHome">🏠 Visão geral do curso</button>' + COURSE.map(function(m){
    const doneCount = m.lessons.filter(l=>done.has(l.id)).length;
    return '<div class="mod" data-mod="'+m.id+'">'+
      '<button class="mod-head" type="button">'+
      '<span class="mod-num">M'+m.num+'</span>'+
      '<span class="mod-title">'+m.title+'</span>'+
      '<span class="mod-count">'+doneCount+'/'+m.lessons.length+'</span>'+
      '<span class="mod-chev">▶</span>'+
      '</button>'+
      '<div class="mod-body">'+m.lessons.map(function(l){
        return '<a class="les-link '+(done.has(l.id)?'done':'')+'" data-les="'+l.id+'" href="#/lesson/'+l.id+'">'+
        '<span class="les-check">✓</span><span>'+l.title+'</span></a>';
      }).join('')+'</div></div>';
  }).join('');
  sb.querySelectorAll('.mod-head').forEach(function(h){h.addEventListener('click',function(){h.parentElement.classList.toggle('open');});});
  $('#sideHome').addEventListener('click',function(){location.hash='#/home';closeSide();});
}

function updateProgress(){
  const pct = Math.round(done.size/totalLessons*100);
  $('#progressFill').style.width=pct+'%';
  $('#progressTxt').textContent=pct+'%';
}

function syncActive(){
  document.querySelectorAll('.les-link').forEach(function(a){
    a.classList.toggle('active', a.dataset.les===currentLesson);
    a.classList.toggle('done', done.has(a.dataset.les));
  });
  const cur = FLAT.find(l=>l.id===currentLesson);
  if(cur){
    const modEl = document.querySelector('.mod[data-mod="'+cur.mod.id+'"]');
    if(modEl) modEl.classList.add('open');
    COURSE.forEach(function(m){
      const el=document.querySelector('.mod[data-mod="'+m.id+'"] .mod-count');
      if(el) el.textContent = m.lessons.filter(l=>done.has(l.id)).length + '/' + m.lessons.length;
    });
  }
}

function renderHome(){
  currentLesson=null; syncActive();
  const vids =
  '<a class="video-card" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=2T86xAtR6Fo"><div class="video-ico">▶</div><div><b>Complete Kubernetes Course — From BEGINNER to PRO</b><small>DevOps Directive (EN) · fundamentos dos Módulos 1–5</small></div></a>'+
  '<a class="video-card" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=UEoxMU_l2xs"><div class="video-ico">▶</div><div><b>Seu Primeiro Projeto Prático DevOps COMPLETO: Docker, AWS, Terraform e CI/CD!</b><small>Maria Lazara (PT-BR) · prática de Docker/CI-CD dos Módulos 0 e 6</small></div></a>'+
  '<a class="video-card" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=MTHoGUFpvE"><div class="video-ico">▶</div><div><b>Vídeo de referência 3</b><small>Complemento do curso (indisponível no YouTube no momento da publicação)</small></div></a>';
  $('#main').innerHTML = '<div class="content">'+
    '<div class="hero"><img src="'+IMG.hero+'" alt="Nave de containers Kubernetes">'+
    '<div class="hero-overlay"><span class="hero-tag">Curso completo · Iniciante → Avançado · v2 aprofundada</span>'+
    '<h1>Kubernetes para <span>Devs .NET</span></h1>'+
    '<p>Do primeiro Pod ao multi-cluster: workloads completos, resiliência, Gateway API, segurança, GitOps e um comparativo profundo AKS × GKE × EKS — validado contra a documentação oficial do Kubernetes e dos providers.</p>'+
    '<div class="hero-actions"><button class="btn btn-primary" id="startBtn">🚀 Começar pelo Módulo 0</button>'+
    '<button class="btn btn-ghost" id="projBtn">🎯 Ir ao projeto final</button></div></div></div>'+
    '<div class="stats">'+
    '<div class="stat"><b>'+COURSE.length+'</b><span>módulos completos</span></div>'+
    '<div class="stat"><b>'+totalLessons+'</b><span>lições práticas</span></div>'+
    '<div class="stat"><b>'+done.size+'</b><span>lições concluídas</span></div>'+
    '<div class="stat"><b>3</b><span>clouds comparados (AKS·GKE·EKS)</span></div>'+
    '</div>'+
    '<h2 class="sec-title">Trilha de aprendizado</h2>'+
    '<div class="trail">'+COURSE.map(function(m){
      return '<div class="trail-card" data-first="'+m.lessons[0].id+'"><span class="tc-num">'+m.num+'</span>'+
      '<span class="lvl lvl-'+m.level+'">'+(m.level==='ini'?'Iniciante':m.level==='int'?'Intermediário':'Avançado')+'</span>'+
      '<h3>'+m.title+'</h3>'+
      '<p>'+m.lessons.length+' lições · '+m.lessons.reduce(function(a,l){return a+l.mins;},0)+' min de leitura+prática</p></div>';
    }).join('')+'</div>'+
    '<h2 class="sec-title">Vídeos de referência (transcrições base)</h2>'+vids+
    '<h2 class="sec-title">Validação de conteúdo</h2>'+
    '<div class="src-grid">'+
    '<div class="src-card"><b>📘 Documentação oficial do Kubernetes</b><small>Todas as áreas de kubernetes.io/docs/concepts cobertas: Architecture, Containers, Workloads, Services/Networking, Storage, Configuration, Security, Policies, Scheduling/Eviction, Cluster Admin e Extending.</small></div>'+
    '<div class="src-card"><b>🎬 DevOps Directive — Beginner to Pro</b><small>As 14 seções do curso (incl. debugging, multi-env, upgrades e developer experience) estão mapeadas neste curso.</small></div>'+
    '<div class="src-card"><b>🎬 Maria Lazara — Projeto DevOps</b><small>Base prática de Docker e CI/CD dos módulos iniciais.</small></div>'+
    '<div class="src-card"><b>☁️ Docs oficiais dos providers</b><small>Pricing e integrações conferidos em: learn.microsoft.com/azure/aks · cloud.google.com/kubernetes-engine · eks.aws/docs.</small></div>'+
    '</div></div>';
  $('#startBtn').addEventListener('click',function(){location.hash='#/lesson/m0l1';});
  $('#projBtn').addEventListener('click',function(){location.hash='#/lesson/m10l4';});
  document.querySelectorAll('.trail-card').forEach(function(c){c.addEventListener('click',function(){location.hash='#/lesson/'+c.dataset.first;});});
}

let currentLesson=null;
function renderLesson(id){
  const idx = FLAT.findIndex(l=>l.id===id);
  if(idx<0) return renderHome();
  const l = FLAT[idx]; currentLesson=id;
  const prev = FLAT[idx-1], next = FLAT[idx+1];
  const isDone = done.has(id);
  $('#main').innerHTML = '<div class="content lesson">'+
    '<div class="crumb">Módulo '+l.mod.num+' <span>▸</span> '+l.mod.title+'</div>'+
    '<h1>'+l.title+'</h1>'+
    '<div class="meta"><span>⏱ ~'+l.mins+' min</span><span>·</span><span>'+(isDone?'✅ concluída':'📖 em andamento')+'</span></div>'+
    l.body+
    '<button class="done-btn '+(isDone?'is-done':'')+'" id="doneBtn">'+(isDone?'✓ Concluída — clicar p/ desmarcar':'Marcar como concluída ✓')+'</button>'+
    '<div class="les-nav">'+
    (prev?'<a class="nav-card" href="#/lesson/'+prev.id+'"><small>← Anterior</small><b>'+prev.title+'</b></a>':'<a class="nav-card" href="#/home"><small>← Início</small><b>Visão geral</b></a>')+
    (next?'<a class="nav-card next" href="#/lesson/'+next.id+'"><small>Próxima →</small><b>'+next.title+'</b></a>':'<a class="nav-card next" href="#/home"><small>Fim 🎉</small><b>Voltar ao início</b></a>')+
    '</div></div>';
  $('#doneBtn').addEventListener('click',function(){ done.has(id)?done.delete(id):done.add(id); saveProgress(); renderSidebar(); updateProgress(); renderLesson(id); });
  try{ if(window.Prism) Prism.highlightAllUnder($('#main')); }catch(e){}
  syncActive();
  window.scrollTo({top:0,behavior:'smooth'});
}

function route(){
  const h = location.hash;
  if(h.indexOf('#/lesson/')===0) renderLesson(h.replace('#/lesson/',''));
  else renderHome();
}
window.addEventListener('hashchange',route);

$('#main').addEventListener('click',function(e){
  const opt=e.target.closest('.quiz-opt');
  if(opt){
    const quiz=opt.closest('.quiz'); if(!quiz||quiz.classList.contains('done'))return;
    const correct=+quiz.dataset.correct, i=+opt.dataset.i;
    quiz.classList.add('done');
    quiz.querySelectorAll('.quiz-opt').forEach(function(b){b.disabled=true; if(+b.dataset.i===correct)b.classList.add('correct');});
    if(i!==correct) opt.classList.add('wrong');
    const fb=quiz.querySelector('.quiz-fb');
    fb.className='quiz-fb '+(i===correct?'ok':'no');
    fb.textContent = i===correct ? '✅ '+quiz.dataset.explain : '❌ Não exatamente. '+quiz.dataset.explain;
    return;
  }
  const tab=e.target.closest('.ptab');
  if(tab){
    const scope=tab.closest('.lesson');
    tab.parentElement.querySelectorAll('.ptab').forEach(function(t){t.classList.toggle('active',t===tab);});
    scope.querySelectorAll('.ptab-panel').forEach(function(p){p.classList.toggle('active',p.dataset.t===tab.dataset.t);});
    return;
  }
  const cp=e.target.closest('.copy-btn');
  if(cp){
    const code=cp.closest('.codeblock').querySelector('code').innerText;
    navigator.clipboard.writeText(code).then(function(){cp.textContent='copiado!';setTimeout(function(){cp.textContent='copiar';},1400);});
  }
});

const INDEX = FLAT.map(function(l){
  const div=document.createElement('div'); div.innerHTML=l.body;
  return {id:l.id,title:l.title,mod:l.mod.title,text:(l.title+' '+l.mod.title+' '+div.textContent).toLowerCase()};
});
function openSearch(){$('#searchModal').classList.add('open');$('#searchInput').value='';$('#searchResults').innerHTML='';setTimeout(function(){$('#searchInput').focus();},50);}
function closeSearch(){$('#searchModal').classList.remove('open');}
$('#openSearch').addEventListener('click',openSearch);
$('#searchModal').addEventListener('click',function(e){if(e.target.id==='searchModal')closeSearch();});
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();}
  if(e.key==='Escape')closeSearch();
});
$('#searchInput').addEventListener('input',function(e){
  const q=e.target.value.trim().toLowerCase();
  const res=$('#searchResults');
  if(!q){res.innerHTML='<div class="sr-empty">Digite para buscar em todo o conteúdo do curso…</div>';return;}
  const hits=INDEX.filter(function(x){return x.text.indexOf(q)>=0;}).slice(0,12);
  res.innerHTML = hits.length? hits.map(function(h){return '<a class="sr-item" href="#/lesson/'+h.id+'"><b>'+h.title+'</b><small>'+h.mod+'</small></a>';}).join('') : '<div class="sr-empty">Nada encontrado 😕 tente "ingress", "hpa", "secrets", "aks"…</div>';
  res.querySelectorAll('.sr-item').forEach(function(a){a.addEventListener('click',closeSearch);});
});

const closeSide=function(){$('#sidebar').classList.remove('open');};
$('#burger').addEventListener('click',function(){$('#sidebar').classList.toggle('open');});
$('#sidebar').addEventListener('click',function(e){if(e.target.closest('.les-link'))closeSide();});
$('#logoHome').addEventListener('click',function(){location.hash='#/home';});

renderSidebar(); updateProgress(); route();
</script>
