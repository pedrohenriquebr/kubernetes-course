<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K8s para Devs .NET — Curso Completo de Kubernetes (Iniciante → Avançado)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css">
<style>
:root{
  --bg:#0b1220; --bg2:#0d1730; --panel:#101f3a; --panel2:#0f1b33; --line:#1e3a5f;
  --text:#e2e8f0; --muted:#94a3b8; --cyan:#22d3ee; --blue:#38bdf8; --violet:#a78bfa;
  --green:#34d399; --amber:#fbbf24; --red:#f87171;
  --mono:'JetBrains Mono',monospace; --sans:'Inter',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15.5px;line-height:1.7}
::selection{background:rgba(34,211,238,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#24466e;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#2f5a8c}

.topbar{position:fixed;inset:0 0 auto 0;height:62px;z-index:60;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:rgba(11,18,32,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.logo svg{width:34px;height:34px}
.logo b{font-weight:800;font-size:17px;letter-spacing:.2px}
.logo b span{color:var(--cyan)}
.logo small{display:block;font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:1.4px;text-transform:uppercase;margin-top:-3px}
.top-search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;width:min(340px,32vw);color:var(--muted);cursor:pointer;transition:.2s}
.top-search:hover{border-color:var(--cyan)}
.top-search kbd{font-family:var(--mono);font-size:10.5px;background:#16294a;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted)}
.progress-wrap{display:flex;align-items:center;gap:10px;min-width:150px}
.progress-bar{flex:1;height:7px;background:#152a4d;border-radius:99px;overflow:hidden;min-width:90px}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:99px;transition:width .5s ease}
.progress-txt{font-family:var(--mono);font-size:11.5px;color:var(--cyan);white-space:nowrap}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:9px;color:var(--text);width:38px;height:38px;cursor:pointer;font-size:17px}

.layout{display:flex;padding-top:62px;min-height:100vh}
#sidebar{width:330px;flex:0 0 330px;position:fixed;top:62px;bottom:0;left:0;overflow-y:auto;
  background:var(--bg2);border-right:1px solid var(--line);padding:18px 14px 60px}
#main{flex:1;margin-left:330px;padding:34px clamp(18px,4vw,56px) 90px}
.content{max-width:940px;margin:0 auto;animation:fadeUp .45s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.side-home{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:linear-gradient(135deg,#123055,#0f2444);
  border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font-weight:700;cursor:pointer;margin-bottom:16px;font-size:14px}
.side-home:hover{border-color:var(--cyan)}
.mod{margin-bottom:8px}
.mod-head{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
  color:var(--text);border-radius:12px;padding:10px 12px;cursor:pointer;transition:.2s}
.mod-head:hover{border-color:#2f5a8c}
.mod-num{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--cyan);background:#0c2038;border:1px solid #1d4ed8aa;
  border-radius:7px;padding:3px 7px;white-space:nowrap}
.mod-title{flex:1;font-size:13.2px;font-weight:700;line-height:1.35}
.mod-count{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.mod-chev{transition:transform .25s;color:var(--muted);font-size:11px}
.mod.open .mod-chev{transform:rotate(90deg)}
.mod-body{display:none;padding:6px 4px 6px 12px;border-left:2px solid var(--line);margin:6px 0 4px 16px}
.mod.open .mod-body{display:block}
.les-link{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:9px;color:var(--muted);cursor:pointer;
  font-size:13px;transition:.15s;text-decoration:none}
.les-link:hover{background:#132848;color:var(--text)}
.les-link.active{background:#0e3350;color:var(--cyan);font-weight:600}
.les-check{width:17px;height:17px;flex:0 0 17px;border-radius:50%;border:1.6px solid #33507a;display:grid;place-items:center;
  font-size:10px;color:transparent;transition:.2s}
.les-link.done .les-check{background:var(--green);border-color:var(--green);color:#06281c}
.les-link.done{color:#7d95b5}

.hero{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);margin-bottom:26px}
.hero img{width:100%;height:340px;object-fit:cover;display:block;filter:saturate(1.05)}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,18,32,.15) 20%,rgba(11,18,32,.94) 88%);
  display:flex;flex-direction:column;justify-content:flex-end;padding:30px}
.hero-tag{font-family:var(--mono);font-size:11px;letter-spacing:2.5px;color:var(--cyan);font-weight:600;text-transform:uppercase}
.hero h1{font-size:clamp(26px,4vw,42px);font-weight:800;line-height:1.15;margin:8px 0 10px}
.hero h1 span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c3d2e8;max-width:660px;font-size:15px}
.hero-actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:11px;padding:11px 20px;font-weight:700;font-size:14px;
  cursor:pointer;border:1px solid transparent;transition:.2s;text-decoration:none;font-family:var(--sans)}
.btn-primary{background:linear-gradient(90deg,#0ea5e9,#22d3ee);color:#04121f}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,211,238,.3)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--cyan);color:var(--cyan)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin:26px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat b{font-size:24px;font-weight:800;color:var(--cyan);font-family:var(--mono)}
.stat span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sec-title{font-size:21px;font-weight:800;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
.sec-title::before{content:'';width:5px;height:22px;border-radius:4px;background:linear-gradient(180deg,var(--cyan),var(--violet))}
.trail{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.trail-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.trail-card:hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 10px 30px rgba(2,8,20,.5)}
.trail-card .lvl{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:600;border-radius:6px;padding:3px 8px;display:inline-block;margin-bottom:10px}
.lvl-ini{background:#052e22;color:var(--green);border:1px solid #14532d}
.lvl-int{background:#2e2405;color:var(--amber);border:1px solid #713f12}
.lvl-adv{background:#2a0a2e;color:#e879f9;border:1px solid #701a75}
.trail-card h3{font-size:15px;font-weight:700;margin-bottom:6px}
.trail-card p{font-size:12.8px;color:var(--muted);line-height:1.55}
.trail-card .tc-num{position:absolute;right:12px;top:8px;font-family:var(--mono);font-size:34px;font-weight:600;color:#173257}
.video-card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;transition:.2s;text-decoration:none;color:var(--text)}
.video-card:hover{border-color:var(--red)}
.video-ico{width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:#3d0d13;border:1px solid #7f1d1d;display:grid;place-items:center;font-size:17px;color:#fca5a5}
.video-card b{font-size:14px;display:block;line-height:1.4}
.video-card small{color:var(--muted);font-size:12px}
.src-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.src-card{background:#0e1c36;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.src-card b{font-size:13.5px;color:var(--cyan);display:block;margin-bottom:4px}
.src-card small{color:var(--muted);font-size:12.5px;line-height:1.55;display:block}

.crumb{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.crumb span{color:var(--cyan)}
.lesson h1{font-size:clamp(23px,3vw,32px);font-weight:800;line-height:1.25;margin-bottom:6px}
.lesson .meta{display:flex;gap:14px;align-items:center;color:var(--muted);font-size:12.5px;margin-bottom:22px;font-family:var(--mono)}
.lesson h2{font-size:19px;font-weight:800;margin:30px 0 10px;color:#f1f5f9}
.lesson h3{font-size:15.5px;font-weight:700;margin:22px 0 8px;color:#dbeafe}
.lesson p{margin:10px 0;color:#cbd5e1}
.lesson ul,.lesson ol{margin:10px 0 10px 22px;color:#cbd5e1}
.lesson li{margin:5px 0}
.lesson li::marker{color:var(--cyan)}
.lesson strong{color:#f8fafc}
.lesson em{color:var(--cyan);font-style:normal;font-weight:600}
.lesson a{color:var(--blue)}
.lesson img.fig{width:100%;border-radius:16px;border:1px solid var(--line);margin:16px 0 6px;display:block}
.figcap{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px;font-family:var(--mono)}
.callout{border-radius:13px;padding:14px 16px;margin:16px 0;font-size:14px;border:1px solid}
.callout.note{background:#0a2b22;border-color:#14532d;color:#bbf7d0}
.callout.note b{color:var(--green)}
.callout.cloud{background:#0c1f3d;border-color:#1d4ed8;color:#bfdbfe}
.callout.cloud b{color:var(--blue)}
.callout.warn{background:#331507;border-color:#92400e;color:#fde68a}
.callout.warn b{color:var(--amber)}
.callout.doc{background:#1e1336;border-color:#6d28d9;color:#ddd6fe}
.callout.doc b{color:var(--violet)}
.callout.lab{background:#05262f;border-color:var(--cyan);color:#cffafe}
.callout.lab b{color:var(--cyan)}
.callout.tip{background:#2e2405;border-color:var(--amber);color:#fde68a}
.callout.tip b{color:var(--amber)}
.callout.deep{background:#140d2e;border-color:#8b5cf6;color:#e9d5ff}
.callout.deep b{color:#c4b5fd}
.callout.lab ol,.callout.lab ul{margin:8px 0 4px 20px;color:#cffafe}
.callout.lab li{margin:5px 0}
.callout.lab code,.callout.tip code,.callout.deep code{background:rgba(255,255,255,.07);border-color:transparent}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin:16px 0}
.terms div{background:#0e1c36;border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:11px;padding:10px 14px}
.terms dt{font-family:var(--mono);font-size:12.5px;color:var(--cyan);font-weight:600;margin-bottom:2px}
.terms dd{font-size:12.8px;color:#cbd5e1;margin:0}
.callout p{margin:4px 0;color:inherit}
table.tbl{width:100%;border-collapse:collapse;margin:16px 0;font-size:13.3px;background:var(--panel);border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.tbl th{background:#12294c;color:var(--cyan);text-align:left;padding:10px 12px;font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);color:#cbd5e1;vertical-align:top}
.tbl tr:hover td{background:#0f2444}
.tbl code{font-family:var(--mono);font-size:12px;color:var(--amber)}

.codeblock{margin:16px 0;border-radius:13px;overflow:hidden;border:1px solid var(--line);background:#0d1526}
.cb-head{display:flex;justify-content:space-between;align-items:center;background:#122036;padding:7px 14px;border-bottom:1px solid var(--line)}
.cb-head span{font-family:var(--mono);font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);font-weight:600}
.copy-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:3px 10px;font-size:11px;cursor:pointer;font-family:var(--mono);transition:.15s}
.copy-btn:hover{color:var(--cyan);border-color:var(--cyan)}
.codeblock pre{margin:0!important;background:transparent!important;padding:14px 16px!important;font-size:12.8px!important;max-height:480px;overflow:auto}
.codeblock code{font-family:var(--mono)!important;font-size:12.8px!important;line-height:1.65!important;text-shadow:none!important}
p code,li code,td code{font-family:var(--mono);font-size:.88em;background:#132848;border:1px solid #1e3a5f;color:#7dd3fc;border-radius:6px;padding:1.5px 6px}

.quiz{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--violet);border-radius:13px;padding:16px 18px;margin:20px 0}
.quiz-q{font-weight:700;color:#f1f5f9;margin-bottom:12px;font-size:14.5px}
.quiz-tag{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:var(--violet);text-transform:uppercase;font-weight:600;display:block;margin-bottom:6px}
.quiz-opt{display:block;width:100%;text-align:left;background:#0e1e3a;border:1px solid var(--line);color:#cbd5e1;border-radius:10px;
  padding:10px 14px;margin:7px 0;cursor:pointer;font-size:13.5px;transition:.15s;font-family:var(--sans)}
.quiz-opt:hover:not(:disabled){border-color:var(--violet);transform:translateX(3px)}
.quiz-opt.correct{background:#052e22;border-color:var(--green);color:#a7f3d0}
.quiz-opt.wrong{background:#3d0d13;border-color:var(--red);color:#fecaca}
.quiz-opt:disabled{cursor:default;opacity:.92}
.quiz-fb{font-size:13px;margin-top:8px;display:none;font-weight:600}
.quiz.done .quiz-fb{display:block}
.quiz-fb.ok{color:var(--green)} .quiz-fb.no{color:var(--red)}

.ptabs{display:flex;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.ptab{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:10px 10px 0 0;padding:8px 18px;cursor:pointer;font-weight:700;font-size:13px;transition:.15s}
.ptab.active{background:#0e2a4d;color:var(--cyan);border-color:var(--cyan);border-bottom-color:#0e2a4d}
.ptab-panel{display:none;background:#0e1c36;border:1px solid var(--line);border-radius:0 12px 12px 12px;padding:16px;margin-top:-1px}
.ptab-panel.active{display:block;animation:fadeUp .3s ease}
.ptab-panel h4{color:var(--cyan);font-size:14px;margin-bottom:6px}
.ptab-panel p{font-size:13.8px}

.les-nav{display:flex;justify-content:space-between;gap:14px;margin-top:44px;flex-wrap:wrap}
.nav-card{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 18px;cursor:pointer;transition:.2s;text-decoration:none;color:var(--text)}
.nav-card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.nav-card small{color:var(--muted);font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;display:block;margin-bottom:4px}
.nav-card b{font-size:13.5px}
.nav-card.next{text-align:right}
.done-btn{display:inline-flex;align-items:center;gap:9px;margin-top:26px;border-radius:11px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid var(--green);background:#052e22;color:var(--green);transition:.2s}
.done-btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(52,211,153,.25)}
.done-btn.is-done{background:var(--green);color:#052e22}

#searchModal{position:fixed;inset:0;background:rgba(4,9,18,.78);backdrop-filter:blur(6px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:9vh 18px 18px}
#searchModal.open{display:flex}
.search-box{width:min(680px,100%);background:var(--bg2);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:fadeUp .25s ease}
.search-box input{width:100%;background:transparent;border:none;outline:none;color:var(--text);font-size:16px;padding:18px 20px;font-family:var(--sans);border-bottom:1px solid var(--line)}
.search-results{max-height:55vh;overflow:auto;padding:8px}
.sr-item{display:block;padding:12px 16px;border-radius:11px;cursor:pointer;text-decoration:none;color:var(--text)}
.sr-item:hover{background:#12294c}
.sr-item b{font-size:14px;display:block}
.sr-item small{color:var(--muted);font-family:var(--mono);font-size:11px}
.sr-empty{padding:26px;text-align:center;color:var(--muted)}

@media(max-width:1020px){
  #sidebar{transform:translateX(-100%);transition:transform .3s ease;z-index:70;width:300px}
  #sidebar.open{transform:none;box-shadow:30px 0 80px rgba(0,0,0,.5)}
  #main{margin-left:0}
  .burger{display:block}
  .top-search{width:auto;flex:1}
  .progress-wrap{display:none}
}
</style>
</head>
<body>

<header class="topbar">
  <button class="burger" id="burger" aria-label="menu">☰</button>
  <div class="logo" id="logoHome">
    <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="#22d3ee" stroke-width="2"/><circle cx="16" cy="16" r="4.5" fill="#38bdf8"/><g stroke="#38bdf8" stroke-width="2"><path d="M16 3v6M16 23v6M3 16h6M23 16h6M6.8 6.8l4.3 4.3M20.9 20.9l4.3 4.3M25.2 6.8l-4.3 4.3M11.1 20.9l-4.3 4.3"/></g></svg>
    <div><b>K8s<span>·Dev</span>Journey</b><small>Kubernetes para Devs .NET · v2 aprofundada</small></div>
  </div>
  <div class="top-search" id="openSearch">🔎 <span style="flex:1;font-size:13px">Buscar lição…</span><kbd>Ctrl K</kbd></div>
  <div class="progress-wrap"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><span class="progress-txt" id="progressTxt">0%</span></div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main id="main"></main>
</div>

<div id="searchModal">
  <div class="search-box">
    <input id="searchInput" placeholder="Buscar conceito, objeto, comando… (ex: statefulset, gateway api, eviction)" autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<!-- Prism: bundle COM clike/markup/css/javascript; componentes na sequência correta -->
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-yaml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-csharp.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-docker.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-go.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-powershell.min.js"></script>

<script>

{id:'m0l1',title:'Como usar este curso',mins:6,body:
'<p>Bem-vindo(a)! Este curso leva você <strong>do zero ao nível avançado</strong> em Kubernetes com o olhar de quem <strong>desenvolve software</strong>. Os conceitos são ensinados de forma <em>agnóstica de provider</em>: tudo que você aprender funciona no AKS (Azure), GKE (Google) e EKS (AWS); as diferenças entre eles são tratadas no Módulo 9.</p>'+
'<h2>A jornada</h2>'+
'<ul><li><strong>Módulos 0–2 (Iniciante):</strong> containers, arquitetura, modelo declarativo e TODOS os tipos de workload (Pod, Deployment, StatefulSet, DaemonSet, Jobs).</li>'+
'<li><strong>Módulos 3–5 (Intermediário):</strong> configuração, storage, rede profunda (EndpointSlices, Gateway API), resiliência, autoscaling, eviction e scheduling.</li>'+
'<li><strong>Módulos 6–8 (Intermediário+):</strong> Helm, Kustomize, CI/CD, GitOps, observabilidade, RBAC, admission control e supply chain.</li>'+

{id:'m0l2',title:'Preparando o ambiente local',mins:10,body:
'<p>Você precisa de três ferramentas: <strong>Docker</strong> (para buildar imagens), <strong>kubectl</strong> (o cliente do Kubernetes) e um <strong>cluster local</strong>. Para desenvolvedores, o <code>kind</code> (Kubernetes in Docker) é a opção mais leve — foi também a abordagem usada no curso do DevOps Directive para o ambiente local.</p>'+
C('bash',`# 1) Docker Desktop (Windows/macOS) ou Docker Engine (Linux)
#    https://docs.docker.com/get-docker/

# 2) kubectl
# Windows (winget):  winget install Kubernetes.kubectl
# macOS:             brew install kubectl
# Linux:             curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"

# 3) kind (cluster local dentro do Docker)
# Windows: winget install Kubernetes.kind   |  macOS: brew install kind

# 4) Criar um cluster local
kind create cluster --name k8sjourney

# 5) Conferir
kubectl cluster-info
kubectl get nodes
kubectl get pods -n kube-system   # CoreDNS e componentes do sistema`)+
'<p>Comandos essenciais do dia a dia:</p>'+
C('bash',`kubectl get pods                 # lista Pods do namespace atual
kubectl get pods -A              # de todos os namespaces
kubectl get pods -o wide         # com node, IP, imagem...
kubectl describe pod NOME        # eventos e detalhes (SEU MELHOR AMIGO p/ debug)
kubectl logs NOME -f             # logs em tempo real (-c se houver +1 container)
kubectl exec -it NOME -- sh      # "entrar" no container
kubectl port-forward svc/NOME 8080:80   # acessar um Service localmente
kubectl apply -f arquivo.yaml    # aplica manifest (cria/atualiza)
kubectl delete -f arquivo.yaml   # remove os objetos do manifest
kubectl explain deployment.spec.strategy   # documentação embutida!`)+

{id:'m1',num:'01',title:'Fundamentos: do Container ao Kubernetes',level:'ini',lessons:[
{id:'m1l1',title:'O que são containers?',mins:9,body:
'<p>Um <strong>container</strong> é um processo isolado que carrega consigo <em>tudo que precisa para rodar</em>: binários, bibliotecas, arquivos de configuração e dependências. O isolamento é feito por recursos do kernel Linux (<em>namespaces</em> para visão isolada de sistema e <em>cgroups</em> para limites de CPU/memória).</p>'+
'<ul><li><strong>Imagem</strong> = o "molde" imutável (camadas de filesystem empilhadas).</li>'+
'<li><strong>Container</strong> = a imagem <em>rodando</em> (instância da imagem).</li>'+
'<li><strong>Registry</strong> = onde as imagens moram (Docker Hub, ACR, GAR, ECR, GHCR).</li></ul>'+
'<p>Na prática .NET, a imagem nasce de um <strong>Dockerfile multi-stage</strong>: uma fase compila com o SDK, outra empacota só o runtime — imagem pequena e segura:</p>'+
C('docker',`# Dockerfile de uma API ASP.NET Core 8
FROM mcr.microsoft.com/dotnet/sdk:8.0 AS build
WORKDIR /src
COPY . .
RUN dotnet restore
RUN dotnet publish -c Release -o /app/publish

FROM mcr.microsoft.com/dotnet/aspnet:8.0 AS final
WORKDIR /app
COPY --from=build /app/publish .
USER 1000                      # nunca rodar como root
EXPOSE 8080
ENTRYPOINT ["dotnet", "MinhaApi.dll"]`)+
C('bash',`docker build -t meuregistry/minha-api:1.0.0 .
docker run -p 8080:8080 meuregistry/minha-api:1.0.0`)+
NOTE('A imagem <code>mcr.microsoft.com/dotnet/aspnet:8.0</code> já cria o usuário <code>app</code>. Imagens sem SDK e sem source reduzem superfície de ataque e aceleram o pull nos nodes — critério importante em Kubernetes.'),
},
{id:'m1l2',title:'Containers vs Máquinas Virtuais',mins:6,body:
'<table class="tbl"><tr><th></th><th>Máquina Virtual</th><th>Container</th></tr>'+
'<tr><td>Isolamento</td><td>Hardware (hipervisor)</td><td>SO (namespaces/cgroups)</td></tr>'+
'<tr><td>Sistema operacional</td><td>Um SO completo <em>por</em> VM</td><td>Compartilha o kernel do host</td></tr>'+
'<tr><td>Tamanho</td><td>GBs</td><td>MBs</td></tr>'+
'<tr><td>Boot</td><td>Minutos</td><td>Milissegundos/segundos</td></tr>'+
'<tr><td>Densidade</td><td>Poucas por host</td><td>Dezenas/centenas por host</td></tr></table>'+
'<p>É exatamente essa leveza que torna o Kubernetes possível: criar e destruir instâncias em segundos, reagindo a falhas e picos. Uma VM leva minutos para subir — tarde demais para self-healing.</p>'+
'<p>Curiosidade: nos clouds, os <em>worker nodes</em> do Kubernetes <strong>são</strong> VMs — containers rodam <em>dentro</em> de VMs. Os modelos se complementam: a VM isola o node; o container isola o app.</p>'},
{id:'m1l3',title:'Por que Kubernetes existe?',mins:8,body:
'<p>Imagine que sua API .NET viralizou. Com Docker "na mão" você precisa responder: em quantas máquinas rodo? Como distribuo as cópias? Como o load balancer descobre quem está vivo? Como faço deploy sem downtime? Como volto uma versão quebrada? <strong>Kubernetes é a resposta padronizada para essas perguntas.</strong></p>'+
'<ul><li><strong>Orquestração:</strong> decide onde cada container roda e redistribui a carga.</li>'+
'<li><strong>Self-healing:</strong> container morreu? Sobe outro. Node morreu? Reagenda os Pods.</li>'+
'<li><strong>Scaling:</strong> réplicas sobem e descem por métricas (CPU, fila, HTTP).</li>'+
'<li><strong>Rollouts seguros:</strong> atualizações graduais com rollback automático.</li>'+
'<li><strong>Service discovery + DNS:</strong> serviços se encontram pelo nome.</li>'+
'<li><strong>Secrets e config:</strong> configuração fora da imagem, por ambiente.</li></ul>'+
'<p>Histórico rápido: nasceu no Google em 2014 (inspirado no <em>Borg</em>, orquestrador interno usado no Google por mais de uma década), foi doado à <strong>CNCF</strong> em 2016 e virou o padrão da indústria — por isso todos os grandes clouds oferecem "Kubernetes gerenciado".</p>'+
CLOUD('Azure → <strong>AKS</strong>, Google → <strong>GKE</strong>, AWS → <strong>EKS</strong>. O núcleo (API, objetos, kubectl) é o mesmo projeto open source; o que muda é o "recheio" de integrações de cada nuvem (Módulo 9).'),
},
{id:'m1l4',title:'Arquitetura: Control Plane e Nodes',mins:12,body:
'<p>Um cluster Kubernetes é dividido em dois "mundos": o <strong>Control Plane</strong> (o cérebro) e os <strong>Worker Nodes</strong> (os músculos, onde seus containers rodam).</p>'+
ARCH_SVG+
'<div class="figcap">Arquitetura de um cluster: Control Plane (decisão) × Worker Nodes (execução)</div>'+
'<h3>Control Plane</h3>'+
'<ul><li><strong>kube-apiserver:</strong> a única porta de entrada. Tudo (kubectl, controllers, kubelets) fala com a API REST. Autenticação, autorização e validação acontecem aqui.</li>'+
'<li><strong>etcd:</strong> banco chave-valor distribuído e consistente. <em>Todo o estado do cluster</em> vive aqui. Se o etcd corrompe, o cluster "esquece" de si mesmo.</li>'+
'<li><strong>kube-scheduler:</strong> observa Pods novos sem node atribuído e escolhe o node ideal (recursos livres, afinidades, taints, políticas).</li>'+
'<li><strong>kube-controller-manager:</strong> roda os <em>controllers</em> (Node, Job, EndpointSlice, ServiceAccount…) em loops infinitos de reconciliação.</li>'+
'<li><strong>cloud-controller-manager:</strong> (em clouds) integra com a API do provider: cria Load Balancers, gerencia rotas e o ciclo de vida de nodes.</li></ul>'+
'<h3>Worker Nodes</h3>'+
'<ul><li><strong>kubelet:</strong> o "agente" do node; garante que os containers descritos nos Pods estejam rodando e reporta status ao Control Plane.</li>'+
'<li><strong>kube-proxy:</strong> mantém regras de rede (iptables/IPVS) que implementam os Services.</li>'+
'<li><strong>container runtime:</strong> executa os containers (containerd e CRI-O são os mais comuns).</li></ul>'+
'<p>Além disso, todo cluster precisa de <strong>add-ons</strong>: o <strong>CoreDNS</strong> é obrigatório na prática (DNS do cluster); ingress controllers, métricas e dashboards são opcionais, porém quase universais.</p>'+
NOTE('Como dev, você quase nunca toca no Control Plane — em clusters gerenciados (AKS/GKE/EKS) ele é operado pelo provider. Mas entender o fluxo <em>kubectl → API Server → etcd → scheduler → kubelet</em> explica 90% dos comportamentos que você verá no <code>kubectl describe</code>.'),
},
{id:'m1l5',title:'O modelo declarativo e os controllers',mins:10,body:
'<p>Aqui está a chave mental do Kubernetes: você <strong>não executa ações</strong>, você <strong>declara o estado desejado</strong> em YAML e aplica contra a API. A partir daí, os <em>controllers</em> trabalham em loop (<strong>reconciliation loop</strong>) comparando <em>estado atual</em> com <em>estado desejado</em> e agem para aproximá-los.</p>'+
C('bash',`# Imperativo (evite no dia a dia):
kubectl create deployment web --image=nginx

# Declarativo (o jeito Kubernetes):
kubectl apply -f deployment.yaml
# "Eu desejo 3 réplicas da imagem X com estes recursos."
# Se alguém deletar um Pod, o controller cria outro.
# Se você mudar replicas para 5, ele escala. Etc.`)+
'<p>Consequências práticas desse modelo:</p>'+
'<ul><li><strong>Self-healing de graça:</strong> delete um Pod de um Deployment e observe outro nascer (<code>kubectl get pods -w</code>).</li>'+
'<li><strong>Seus YAMLs são o source of truth</strong> — devem viver no Git (base do GitOps, Módulo 6).</li>'+
'<li><strong>Idempotência:</strong> rodar <code>apply</code> várias vezes não duplica nada; só converge.</li></ul>'+
QUIZ('Você aplicou um Deployment com replicas: 3. Um node inteiro cai, levando 1 Pod junto. O que acontece?',
['Nada — o Deployment fica com 2 réplicas até você intervir.','O controller do Deployment cria um Pod substituto e o scheduler o agenda em outro node saudável.','O cluster inteiro reinicia para recuperar o estado.','O etcd restaura o container morto no mesmo node.'],1,
'Correto! O controller percebe atual(2) ≠ desejado(3) e o scheduler agenda um Pod novo em node saudável. Self-healing por reconciliação.')+
QUIZ('Qual componente guarda o estado do cluster?',
['kube-proxy','kubelet','etcd','container runtime'],2,
'Isso! O etcd é o banco distribuído que persiste todo o estado do cluster.')+
DOC('Este módulo cobre as seções <em>Overview</em> e <em>Cluster Architecture</em> da documentação oficial (kubernetes.io/docs/concepts).')}
]},

{id:'m2',num:'02',title:'Workloads Completos',level:'ini',lessons:[
{id:'m2l1',title:'Pods: a unidade mínima',mins:9,body:
'<p>O <strong>Pod</strong> é a menor unidade agendável do Kubernetes: um ou mais containers que compartilham rede (mesmo IP, comunicação via <code>localhost</code>) e podem compartilhar volumes, tratados como uma unidade. Na prática, 99% dos Pods têm <strong>1 container</strong>; o padrão multi-container é o <em>sidecar</em> (ex.: agente de logs ao lado da sua API).</p>'+
C('yaml',`apiVersion: v1
kind: Pod
metadata:
  name: minha-api
  labels:            # etiquetas chave=valor para seleção/organização
    app: minha-api
    tier: backend
spec:
  containers:
  - name: api
    image: meuregistry/minha-api:1.0.0
    ports:
    - containerPort: 8080`)+
C('bash',`kubectl apply -f pod.yaml
kubectl get pod minha-api
kubectl delete pod minha-api`)+
'<p>Cada Pod recebe um <strong>IP único dentro do cluster</strong>. Mas atenção ao conceito mais importante desta lição: <strong>Pods são efêmeros</strong>. Eles nascem, morrem e <em>nunca voltam</em> — outro Pod (com outro IP e outro nome) nasce no lugar. Por isso:</p>'+
'<ul><li>Nunca aponte para o IP de um Pod → use <strong>Services</strong> (lição 4).</li>'+
'<li>Nunca crie Pods "na mão" em produção → use <strong>Deployments</strong> (lição 2).</li>'+
'<li>Estado que precisa sobreviver → <strong>Volumes externos</strong> (Módulo 3).</li></ul>'+
'<p>Um Pod passa por fases: <code>Pending</code> (aceito, mas containers não criados/agendados ainda), <code>Running</code>, <code>Succeeded</code>/<code>Failed</code> (Pods de Job) e <code>Unknown</code> (kubelet sem resposta). O <code>restartPolicy</code> (<code>Always</code> por padrão; <code>OnFailure</code>/<code>Never</code> para Jobs) define como o kubelet trata containers que morrem.</p>'},
{id:'m2l2',title:'Deployments e ReplicaSets',mins:11,body:
'<p>Na vida real usamos o trio da figura abaixo: o <strong>Deployment</strong> (objeto de mais alto nível, que você versiona no Git) gerencia um <strong>ReplicaSet</strong> (que garante "N réplicas idênticas"), que por sua vez gerencia os <strong>Pods</strong>. O <strong>Service</strong> encontra esses Pods por <em>labels</em> e distribui o tráfego.</p>'+
FIG(IMG.deploy,'Deployment → ReplicaSet → Pods, com o Service roteando por label (app=web)')+
C('yaml',`apiVersion: apps/v1
kind: Deployment
metadata:
  name: minha-api
spec:
  replicas: 3                      # estado desejado
  revisionHistoryLimit: 5          # ReplicaSets antigos guardados p/ rollback
  selector:
    matchLabels:
      app: minha-api               # quais Pods "são meus"
  template:                        # "receita" do Pod (é um Pod embutido!)
    metadata:
      labels:
        app: minha-api
    spec:
      containers:
      - name: api
        image: meuregistry/minha-api:1.0.0
        ports:
        - containerPort: 8080`)+
C('bash',`kubectl apply -f deployment.yaml
kubectl get deploy,rs,pod -l app=minha-api
kubectl scale deploy/minha-api --replicas=5
kubectl set image deploy/minha-api api=meuregistry/minha-api:1.1.0`)+
'<p>Detalhe de mecanismo: a cada mudança no template, o Deployment cria um <strong>ReplicaSet novo</strong> e mantém os antigos (até <code>revisionHistoryLimit</code>) — é isso que permite o rollback instantâneo.</p>'+
NOTE('Repare no padrão: <code>spec.selector.matchLabels</code> do Deployment precisa "bater" com <code>template.metadata.labels</code>. Esse casamento de labels × selectors é o sistema nervoso do Kubernetes — Services, NetworkPolicies e HPA usam a mesma ideia.'),
},
{id:'m2l3',title:'Rollouts, rollbacks e estratégias',mins:9,body:
'<p>Quando você muda a imagem (ou o template) de um Deployment, ele faz um <strong>rolling update</strong>: cria um ReplicaSet novo e migra os Pods gradualmente, sem downtime.</p>'+
C('yaml',`spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # até 1 Pod "a mais" durante o rollout
      maxUnavailable: 0    # nenhum Pod indisponível (zero downtime)`)+
C('bash',`kubectl rollout status deploy/minha-api      # acompanha
kubectl rollout history deploy/minha-api       # versões anteriores
kubectl rollout undo deploy/minha-api          # VOLTA A VERSÃO (salva-vidas)
kubectl rollout undo deploy/minha-api --to-revision=2
kubectl rollout restart deploy/minha-api       # recria Pods (ex.: recarregar Secrets)`)+
'<table class="tbl"><tr><th>Estratégia</th><th>Como funciona</th><th>Quando usar</th></tr>'+
'<tr><td>RollingUpdate</td><td>troca gradual, velho e novo coexistem</td><td>padrão; APIs stateless</td></tr>'+
'<tr><td>Recreate</td><td>derruba tudo, depois sobe o novo</td><td>apps que não aceitam 2 versões (lock de arquivo, migração única)</td></tr>'+
'<tr><td>Blue/Green</td><td>duas versões completas; o Service "vira a chave"</td><td>rollback instantâneo crítico</td></tr>'+
'<tr><td>Canary</td><td>% do tráfego vai para o novo primeiro</td><td>validar em produção com risco mínimo (via Gateway API/service mesh)</td></tr></table>'},
{id:'m2l4',title:'Services: rede estável para Pods efêmeros',mins:11,body:
'<p>Se Pods têm IP descartável, como outro serviço chama sua API? Com um <strong>Service</strong>: um IP virtual + nome DNS estável que distribui tráfego para o conjunto de Pods que casam com o <em>selector</em>.</p>'+
C('yaml',`apiVersion: v1
kind: Service
metadata:
  name: minha-api
spec:
  selector:
    app: minha-api        # "aponta" para os Pods do Deployment
  ports:
  - port: 80              # porta do Service (dentro do cluster)
    targetPort: 8080      # porta do container`)+
'<table class="tbl"><tr><th>Tipo</th><th>Alcance</th><th>Uso típico</th></tr>'+
'<tr><td><code>ClusterIP</code> (padrão)</td><td>só dentro do cluster</td><td>comunicação entre microsserviços</td></tr>'+
'<tr><td><code>NodePort</code></td><td>IP do node + porta alta (faixa padrão 30000–32767)</td><td>dev/testes; evite em produção</td></tr>'+
'<tr><td><code>LoadBalancer</code></td><td>exposto via LB do cloud</td><td>entrada de tráfego externo em clouds</td></tr>'+
'<tr><td><code>ExternalName</code></td><td>alias DNS (CNAME) p/ fora do cluster</td><td>referenciar SaaS/bancos externos</td></tr></table>'+
'<p>Dentro do cluster, qualquer Pod resolve <code>minha-api</code> (mesmo namespace) ou <code>minha-api.meu-ns.svc.cluster.local</code>. Em .NET:</p>'+
C('csharp',`// Service discovery "de graça" via DNS do cluster
var client = httpClientFactory.CreateClient("pedidos");
// baseUrl configurado como: http://pedidos-api  (ClusterIP service)
var resp = await client.GetAsync("/pedidos/42");`)+
CLOUD('Em AKS/GKE/EKS, um Service do tipo <code>LoadBalancer</code> cria automaticamente um Azure Load Balancer / Google Cloud Load Balancer / AWS NLB de verdade, com IP público. É assim que sua API aparece para o mundo sem Ingress.')+
'<p>Guarde para a lição "Services a fundo": <code>sessionAffinity</code>, <code>externalTrafficPolicy</code> e Services headless existem para casos específicos — e fazem diferença em produção.</p>'},
{id:'m2l5',title:'Namespaces, Labels e Selectors',mins:8,body:
'<p><strong>Namespaces</strong> são "clusters virtuais" dentro do cluster: isolam nomes, organizam times/ambientes e permitem cotas e RBAC por área (<code>dev</code>, <code>prod</code>, <code>pagamentos</code>…). Alguns namespaces existem por padrão: <code>default</code>, <code>kube-system</code> (componentes do sistema) e <code>kube-public</code>. <strong>Labels</strong> classificam objetos; <strong>selectors</strong> consultam essas classificações.</p>'+
C('bash',`kubectl create namespace pagamentos
kubectl apply -f deployment.yaml -n pagamentos
kubectl get pods -n pagamentos
kubectl get pods -l app=minha-api,tier=backend   # selector por labels
kubectl get pods -l 'environment in (staging, production)'`)+
C('yaml',`metadata:
  namespace: pagamentos
  labels:
    app: minha-api
    tier: backend
    versao: "1.2"
    equipe: checkout`)+
WARN('Evite a tentação de criar "um namespace por developer" sem governança: cada namespace multiplica superfícies de rede, cotas e RBAC a manter. Comece com namespaces por ambiente ou por domínio de negócio.')+
QUIZ('Por que NÃO devemos chamar outro microsserviço pelo IP do Pod dele?',
['Porque IPs de Pods são efêmeros e mudam a cada recriação.','Porque Pods não têm IP.','Porque o DNS do cluster bloqueia IPs.','Porque o kube-proxy criptografa o IP.'],0,
'Exato! Pods nascem e morrem; o Service dá um nome/IP estável na frente deles.')+
QUIZ('Um Service descobre quais Pods atender usando…',
['o nome do Deployment','selector contra as labels dos Pods','a porta 443','o namespace apenas'],1,
'Isso! Selector × labels é o mecanismo universal de "encaixe" entre objetos.'),
},
{id:'m2l6',title:'StatefulSet, DaemonSet, Jobs e CronJobs',mins:13,body:
'<p>Deployment não é o único workload. A documentação oficial lista cinco tipos principais; saber escolher entre eles é o que separa um curso completo de um superficial.</p>'+
'<table class="tbl"><tr><th>Workload</th><th>Perfil</th><th>Exemplos</th></tr>'+
'<tr><td>Deployment</td><td>stateless, réplicas intercambiáveis</td><td>APIs, frontends, workers sem estado</td></tr>'+
'<tr><td>StatefulSet</td><td>stateful, identidade estável</td><td>bancos, brokers, sistemas distribuídos</td></tr>'+
'<tr><td>DaemonSet</td><td>1 cópia por node</td><td>agentes de log/monitoring, CNI</td></tr>'+
'<tr><td>Job</td><td>tarefa única até concluir</td><td>migrações, importações, batch</td></tr>'+
'<tr><td>CronJob</td><td>Jobs agendados</td><td>relatórios noturnos, backups, limpeza</td></tr></table>'+
'<h3>StatefulSet — identidade estável</h3>'+
'<p>Cada réplica ganha nome fixo (<code>postgres-0</code>, <code>postgres-1</code>…), DNS estável e <em>seu próprio disco</em> via <code>volumeClaimTemplates</code>. A escala e o rollout são <strong>ordenados</strong> (0 → N). Exige um Service <em>headless</em>.</p>'+
C('yaml',`apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres }
spec:
  serviceName: postgres-headless
  replicas: 3
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
      - name: pg
        image: postgres:16
        volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:          # um PVC por réplica, criado automaticamente
  - metadata: { name: data }
    spec:
      accessModes: ["ReadWriteOnce"]
      resources: { requests: { storage: 10Gi } }`)+
WARN('Como dev, prefira bancos <strong>gerenciados</strong> do cloud (Azure SQL, Cloud SQL, RDS) a rodar banco em StatefulSet. StatefulSet faz sentido quando o produto é literalmente o banco (operadores como CloudNativePG/Strimzi cuidam disso).')+
'<h3>DaemonSet — um por node</h3>'+
'<p>O DaemonSet garante que todos (ou alguns) nodes rodem uma cópia do Pod. É assim que rodam coletores de log (Fluent Bit), agentes de métricas (node-exporter) e os próprios componentes de rede (CNI).</p>'+
'<h3>Job e CronJob</h3>'+
C('yaml',`apiVersion: batch/v1
kind: Job
metadata: { name: migra-dados }
spec:
  completions: 1          # quantos Pods precisam terminar com sucesso
  parallelism: 1
  backoffLimit: 6         # tentativas antes de desistir (padrão: 6)
  template:
    spec:
      restartPolicy: Never    # Jobs NUNCA usam Always
      containers:
      - name: migra
        image: meuregistry/migrador:2.0.0
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: relatorio-noturno }
spec:
  schedule: "0 2 * * *"               # todo dia às 02:00
  concurrencyPolicy: Forbid           # não sobrepõe execuções
  successfulJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: rel
            image: meuregistry/relatorios:1.0.0`)+
NOTE('Migração de banco no deploy? O padrão .NET é um <strong>Job</strong> com <code>dotnet ef database update</code> (ou <code>DbInitializer</code> via <code>Host.CreateApplicationBuilder</code>) rodando <em>antes</em> do rollout do Deployment — ou como <em>init container</em> (próxima lição).')+
QUIZ('Uma tarefa de processamento de folha de pagamento roda todo dia 5 às 22h e não pode se sobrepor. Qual workload?',
['Deployment com replicas: 1','DaemonSet','CronJob com concurrencyPolicy: Forbid','StatefulSet'],2,
'Perfeito! Agendamento + prevenção de sobreposição é exatamente o caso do CronJob com Forbid.'),
},
{id:'m2l7',title:'Init containers, hooks e ciclo de vida do Pod',mins:10,body:
'<p><strong>Init containers</strong> rodam <em>em sequência até completar</em> antes dos containers principais. Casos clássicos: aguardar uma dependência, baixar configuração, rodar migração de banco.</p>'+
C('yaml',`spec:
  initContainers:
  - name: espera-postgres
    image: busybox:1.36
    command: ['sh','-c','until nslookup postgres.pagamentos.svc.cluster.local; do sleep 2; done']
  - name: migra-banco
    image: meuregistry/minha-api:1.0.0
    command: ['dotnet','MinhaApi.dll','--migrate-only']
  containers:
  - name: api
    image: meuregistry/minha-api:1.0.0`)+
'<p><strong>Lifecycle hooks</strong> executam nos limites de vida do container:</p>'+
'<ul><li><code>postStart</code>: logo após o container criar (sem garantia de ordem com o entrypoint).</li>'+
'<li><code>preStop</code>: <em>antes</em> do SIGTERM — o ponto-chave para graceful shutdown.</li></ul>'+
'<p>Sequência de encerramento de um Pod: <code>preStop</code> → sinal <strong>SIGTERM</strong> → espera até <code>terminationGracePeriodSeconds</code> (padrão 30s) → <strong>SIGKILL</strong>.</p>'+
C('yaml',`spec:
  terminationGracePeriodSeconds: 45
  containers:
  - name: api
    lifecycle:
      preStop:
        exec:
          command: ["sh","-c","sleep 5"]   # drena conexões do LB/Service`)+
NOTE('O Generic Host do ASP.NET Core já trata SIGTERM com <em>graceful shutdown</em> (para de aceitar requests e aguarda os em andamento). Para Workers (<code>BackgroundService</code>), implemente <code>StopAsync</code> corretamente e considere <code>services.Configure&lt;HostOptions&gt;(o =&gt; o.ShutdownTimeout = TimeSpan.FromSeconds(40));</code> para casar com o grace period.')}
]},

{id:'m3',num:'03',title:'Configuração, Secrets & Storage',level:'int',lessons:[
{id:'m3l1',title:'ConfigMaps: configuração fora da imagem',mins:9,body:
'<p>Imagem imutável + configuração variável por ambiente = <strong>ConfigMap</strong>. Ele injeta pares chave-valor como <em>variáveis de ambiente</em> ou como <em>arquivos</em> montados em volume. Limite de tamanho: <strong>1 MiB</strong> por ConfigMap.</p>'+
C('yaml',`apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  Logging__LogLevel__Default: "Information"   # __ vira : na config do .NET
  FeatureFlags__NovoCheckout: "true"`)+
C('yaml',`spec:
  containers:
  - name: api
    image: meuregistry/minha-api:1.0.0
    envFrom:                 # injeta TUDO como env vars
    - configMapRef:
        name: api-config
    env:                     # ou escolha uma a uma
    - name: MEU_SETTING
      valueFrom:
        configMapKeyRef:
          name: api-config
          key: FeatureFlags__NovoCheckout
    volumeMounts:            # OU como arquivo (ex.: appsettings.custom.json)
    - name: cfg
      mountPath: /app/config`)+
NOTE('A configuração do ASP.NET Core lê variáveis de ambiente automaticamente — e <code>__</code> mapeia para <code>:</code> na hierarquia. Ou seja: <em>zero código</em>, seu <code>IConfiguration</code> simplesmente funciona no cluster.')+
WARN('ConfigMap NÃO é para dados sensíveis — ele não é criptografado e aparece em <code>kubectl get -o yaml</code>. Para isso use Secrets (próxima lição). Dica: marque ConfigMaps críticos com <code>immutable: true</code> para evitar mudanças acidentais (exige recriar o objeto para alterar).')},
{id:'m3l2',title:'Secrets: dados sensíveis',mins:10,body:
'<p><strong>Secrets</strong> guardam dados sensíveis (connection strings, tokens, certificados). Por padrão são armazenados em base64 no etcd — <em>codificação, não criptografia</em>. Em produção: habilite <strong>encryption at rest</strong> no etcd e/ou use cofres externos (Módulo 8).</p>'+
'<table class="tbl"><tr><th>Tipo de Secret</th><th>Uso</th></tr>'+
'<tr><td><code>Opaque</code> (padrão)</td><td>dados arbitrários</td></tr>'+
'<tr><td><code>kubernetes.io/tls</code></td><td>certificados (usado pelo Ingress)</td></tr>'+
'<tr><td><code>kubernetes.io/dockerconfigjson</code></td><td>credenciais de registry privado (imagePullSecrets)</td></tr>'+
'<tr><td><code>kubernetes.io/service-account-token</code></td><td>tokens de ServiceAccount (legado)</td></tr></table>'+
C('bash',`# criar sem colocar a senha no histórico do shell:
kubectl create secret generic api-secrets \\
  --from-literal=ConnectionStrings__Default="Server=db;Password=***" \\
  --from-literal=ApiKeyIntegracoes="super-secreta"

kubectl create secret tls api-tls --cert=tls.crt --key=tls.key`)+
C('yaml',`spec:
  containers:
  - name: api
    envFrom:
    - secretRef:
        name: api-secrets    # ConnectionStrings__Default vira env var
  # imagem em registry privado:
  imagePullSecrets:
  - name: registry-cred`)+
NOTE('No .NET, env vars viram configuração automaticamente, então <code>builder.Configuration.GetConnectionString("Default")</code> funciona sem tocar em arquivo. Segredos grandes demais? Lembre do limite de 1 MiB por Secret — e evite versionar YAML de Secret no Git sem criptografia (SOPS/Sealed Secrets, Módulo 8).')},
{id:'m3l3',title:'Volumes, PV e PVC',mins:11,body:
'<p>Containers têm filesystem efêmero: arquivos somem com o Pod. Para persistir, o Kubernetes abstrai storage em três camadas:</p>'+
'<ul><li><strong>Volume:</strong> diretório montado no Pod. Tipos comuns: <code>emptyDir</code> (temporário, some com o Pod), <code>configMap</code>/<code>secret</code> (arquivos de config), <code>persistentVolumeClaim</code> (disco).</li>'+
'<li><strong>PersistentVolume (PV):</strong> o "disco" provisionado (Azure Disk, EBS, GCE PD, NFS…).</li>'+
'<li><strong>PersistentVolumeClaim (PVC):</strong> o <em>pedido</em> de storage que o Pod referencia — o dev declara "quanto e como", o cluster resolve "onde".</li></ul>'+
C('yaml',`apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads-pvc
spec:
  accessModes: ["ReadWriteOnce"]     # RWO: 1 node; RWX: vários; ROX: leitura p/ vários
  resources:
    requests:
      storage: 10Gi`)+
C('yaml',`spec:
  containers:
  - name: api
    volumeMounts:
    - name: uploads
      mountPath: /app/uploads        # caminho dentro do container
  volumes:
  - name: uploads
    persistentVolumeClaim:
      claimName: uploads-pvc`)+
NOTE('Em ASP.NET Core, aponte pastas de upload/temp para o mount path via configuração. Com múltiplas réplicas + disco <code>ReadWriteOnce</code>, os Pods precisam cair no mesmo node — para uploads compartilhados use storage <code>RWX</code> (Azure Files, EFS, Filestore).')},
{id:'m3l4',title:'StorageClass: provisionamento dinâmico',mins:8,body:
'<p>A <strong>StorageClass</strong> define <em>como</em> o storage é provisionado sob demanda (provisioner + parâmetros + política). Quando seu PVC é criado, o cluster cria o PV automaticamente. Ciclo de vida do PV: <strong>Provisioning</strong> (estático ou dinâmico) → <strong>Binding</strong> → <strong>Using</strong> → <strong>Reclaiming</strong> (<code>Delete</code> apaga o disco; <code>Retain</code> preserva).</p>'+
'<table class="tbl"><tr><th>Cloud</th><th>Provisioners típicos</th><th>Classes comuns</th></tr>'+
'<tr><td>AKS</td><td><code>disk.csi.azure.com</code>, <code>file.csi.azure.com</code></td><td><code>managed-csi</code>, <code>azurefile-csi</code> (RWX)</td></tr>'+
'<tr><td>GKE</td><td><code>pd.csi.storage.gke.io</code></td><td><code>standard-rwo</code>, <code>premium-rwo</code></td></tr>'+
'<tr><td>EKS</td><td><code>ebs.csi.aws.com</code>, <code>efs.csi.aws.com</code> (RWX)</td><td><code>gp2</code>/<code>gp3</code></td></tr></table>'+
C('bash',`kubectl get storageclass            # o que existe no seu cluster
kubectl get pvc,pv                  # claims e volumes vinculados
kubectl describe pvc uploads-pvc    # por que não vinculou ainda?`)+
'<p>Detalhe importante: <code>volumeBindingMode: WaitForFirstConsumer</code> faz o disco ser criado na zona onde o Pod realmente cair — essencial em clusters multi-zona. StorageClasses também suportam expansão (<code>allowVolumeExpansion: true</code>) e snapshots.</p>'},
{id:'m3l5',title:'Downward API, LimitRange e ResourceQuota',mins:9,body:
'<p><strong>Downward API</strong> expõe metadados do próprio Pod para o container (via env ou volume) — sem chamar a API do Kubernetes:</p>'+
C('yaml',`spec:
  containers:
  - name: api
    env:
    - name: POD_NAME
      valueFrom: { fieldRef: { fieldPath: metadata.name } }
    - name: POD_NAMESPACE
      valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
    - name: MEM_LIMIT
      valueFrom: { resourceFieldRef: { resource: limits.memory } }`)+
'<p><strong>LimitRange</strong> define padrões e limites por container/Pod no namespace; <strong>ResourceQuota</strong> impõe teto agregado no namespace. Juntos, são a governança multi-tenant do Kubernetes:</p>'+
C('yaml',`apiVersion: v1
kind: ResourceQuota
metadata: { name: pagamentos-quota, namespace: pagamentos }
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.memory: 64Gi
    count/deployments.apps: "15"
    count/secrets: "20"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata: { name: limites, namespace: pagamentos }
spec:
  limits:
  - type: Container
    default: { cpu: "1", memory: 512Mi }           # limit se omitido
    defaultRequest: { cpu: 250m, memory: 256Mi }   # request se omitido`)+
WARN('Efeito prático para devs: se o namespace tem ResourceQuota, seu <code>kubectl apply</code> de um Deployment <strong>sem requests/limits</strong> pode ser rejeitado (a menos que um LimitRange preencha os valores). Declarar recursos sempre — você já vai fazer isso por resiliência anyway (Módulo 5).')}
]},
